name: แก้ชนเลขรุ่นอัตโนมัติ

# ═══════════════════════════════════════════════════════════════
# ทำไมถึงมีตัวนี้
#
# INVARIANTS F4 บังคับให้ทุก PR ที่แก้ .html บัมป์ <meta name="app-version">
# ซึ่งอยู่บรรทัดเดียวกันเสมอ ใบไหนเมิจทีหลังจึง conflict แน่นอน
# 9-10 ก.ย. 2026 เจ้าของต้องมาแก้เองติดกันหลายรอบ (#66 · #68)
# และ PR ที่ conflict จะ **ไม่มีเช็คไหนรันเลย** (GitHub สร้าง merge ref ไม่ได้)
# ผู้ตรวจกับช่างซ่อมจึงช่วยอะไรไม่ได้ ต้องรอคนอย่างเดียว
#
# ขอบเขตแคบโดยตั้งใจ
#   ✓ แก้เฉพาะใบที่ชน **แค่บรรทัด app-version** ในไฟล์ .html
#   ✗ ชนอย่างอื่นด้วยแม้บรรทัดเดียว — ไม่แตะอะไรเลย คอมเมนต์บอกครั้งเดียวต่อ commit
#   ✗ ไม่เรียกโมเดล ไม่เดาว่าโค้ดฝั่งไหนถูก — bash กับสคริปต์ที่มีเทสล้วน ๆ
#
# 🔒 สคริปต์แก้ไฟล์รันจาก checkout ของ **main** เท่านั้น
#    โค้ดใน branch ของ PR ไม่ถูกรันเลย ไม่งั้น PR แก้สคริปต์แล้วได้ AGENT_PUSH_PAT ไป
#
# ⚠️ push ด้วย AGENT_PUSH_PAT เพราะ push ด้วย GITHUB_TOKEN ไม่ยิง synchronize
#    เช็คที่ required จะไม่รันบน commit ใหม่ แล้ว PR จะ merge ไม่ได้ (บันทึกไว้ใน agent-refix.yml)
# ═══════════════════════════════════════════════════════════════

on:
  push:
    branches: [main]
  # รอบสำรอง — เก็บใบที่ถูกข้ามไปเพราะเพิ่งมี commit ใหม่ หรือช่างซ่อมกำลังทำงานอยู่
  # ไม่มีรอบนี้ ใบพวกนั้นจะค้างจนกว่า main จะขยับอีกครั้ง ซึ่งอาจเป็นวันพรุ่งนี้
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

# ทีละรอบ — สองรอบพร้อมกันจะแย่งกัน push ใส่ branch เดียวกัน
concurrency:
  group: version-conflict
  cancel-in-progress: false

jobs:
  resolve:
    name: แก้ PR ที่ชนแค่เลขรุ่น
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      # อ่านคอมเมนต์ผ่าน REST /issues/N/comments (ตัวกันคอมเมนต์ซ้ำ) — ใส่ไว้ชัด ๆ
      # เมื่อประกาศบล็อก permissions แล้ว สิทธิ์ที่ไม่ได้ระบุจะเป็น none
      # ถ้า GitHub ไม่นับ pull-requests ว่าครอบ endpoint นี้ จะได้ 403 -> แดงทุก 30 นาที
      # และคอมเมนต์ปฏิเสธไม่ถูกโพสต์ ซึ่งเกิดกับใบที่ตัวนี้มีไว้ช่วยพอดี
      issues: read
      actions: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # ไม่เก็บ GITHUB_TOKEN ไว้ใน git config — ไม่งั้น header ของมันอาจไปแย่ง
          # กับ PAT ตอน push แล้วได้ push ด้วย token ผิดตัว (ไม่ยิง synchronize)
          # repo เป็น public จึง fetch branch ของ PR ได้โดยไม่ต้องใช้ token
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ไล่ทุก PR ที่เปิดอยู่
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUSH_TOKEN: ${{ secrets.AGENT_PUSH_PAT }}
          REPO: ${{ github.repository }}
          QUIET_MIN: ${{ vars.VERSION_CONFLICT_QUIET_MINUTES || 10 }}
        run: |
          set -euo pipefail

          # ไม่เช็ค AGENT_PUSH_PAT ตรงนี้ — เช็คตอนจะ push จริงในงานต่อใบเท่านั้น
          # ถ้าเช็คแล้ว exit 1 ตรงนี้ รอบที่ไม่มีใบไหนชนเลยก็จะแดงทุก 30 นาที
          # เจ้าของได้เมลล้มเหลวชั่วโมงละสองฉบับโดยไม่มีงานค้างจริง

          export TRUSTED="$GITHUB_WORKSPACE/.github/scripts/version-conflict.mjs"
          export RESULTS="$RUNNER_TEMP/results.txt"
          : > "$RESULTS"

          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin main
          export MAIN_SHA
          MAIN_SHA=$(git rev-parse origin/main)

          prs=$(gh pr list -R "$REPO" --base main --state open --limit 50 \
                  --json number,headRefName,isCrossRepository)
          count=$(jq length <<< "$prs")
          echo "PR ที่เปิดอยู่ $count ใบ · main @ ${MAIN_SHA:0:7}"
          if [ "$count" -eq 0 ]; then exit 0; fi

          # ใบที่ช่างซ่อมกำลังทำงานหรือรอคิวอยู่ — ห้าม push แทรก
          # ไม่งั้น push ของช่างซ่อม (ไม่ force) จะโดนปฏิเสธและทิ้งงานทั้งรอบ
          running=$(gh run list -R "$REPO" --workflow agent-refix.yml --status in_progress \
                      --json headBranch --jq '.[].headBranch')
          queued=$(gh run list -R "$REPO" --workflow agent-refix.yml --status queued \
                      --json headBranch --jq '.[].headBranch')
          export BUSY
          BUSY=$(printf '%s\n%s\n' "$running" "$queued")

          # ═══════════════════════════════════════════════════════════
          # งานต่อใบรันเป็น bash **อีกโปรเซส** ไม่ใช่ฟังก์ชัน
          #
          # set -e ถูกปิดโดยปริยายในทุกอย่างที่ถูกเรียกในเงื่อนไขของ if หรือหลัง ||
          # ถ้าเขียนเป็นฟังก์ชันแล้วเรียก `if ! one_pr; then` คำสั่งที่ล้มข้างในจะไม่หยุด
          # แล้วไปทำขั้นถัดไปต่อ (เช่น push ทั้งที่ commit ล้ม) โดยไม่มีอะไรฟ้อง
          # โปรเซสใหม่มี set -e ของตัวเอง ไม่สนว่าถูกเรียกจากไหน
          # ═══════════════════════════════════════════════════════════
          cat > "$RUNNER_TEMP/one-pr.sh" <<'EOS'
          set -euo pipefail
          num="$1"; head="$2"; fork="$3"

          note() { printf '#%s\t%s\n' "$num" "$1" >> "$RESULTS"; echo "► $1"; }

          if [ "$fork" = "true" ]; then note "มาจาก fork — ข้าม"; exit 0; fi
          if grep -qxF -- "$head" <<< "$BUSY"; then note "ช่างซ่อมกำลังทำงานกับใบนี้ — ข้าม รอรอบหน้า"; exit 0; fi

          git fetch -q origin "+refs/heads/$head:refs/remotes/origin/$head"
          head_sha=$(git rev-parse "refs/remotes/origin/$head")

          # ช่วงเงียบ — commit ที่เพิ่งเกิดแปลว่าอาจมี session อื่นกำลัง push ต่อ
          # (10 ก.ย. 2026: #68 ถูกสร้าง 1 นาทีก่อนตรวจเจอว่าชน)
          age=$(( ( $(date +%s) - $(git log -1 --format=%ct "$head_sha") ) / 60 ))
          if [ "$age" -lt "$QUIET_MIN" ]; then
            note "commit ล่าสุดเพิ่ง $age นาที (ต้องเงียบ $QUIET_MIN นาที) — ข้าม รอรอบหน้า"
            exit 0
          fi

          wt="$RUNNER_TEMP/pr-$num"
          rm -rf "$wt"
          git worktree add -q --detach "$wt" "$head_sha"
          trap 'cd "$GITHUB_WORKSPACE"; git worktree remove --force "$wt" >/dev/null 2>&1 || true' EXIT
          cd "$wt"

          if git -c merge.conflictStyle=merge merge --no-ff --no-commit origin/main >/dev/null 2>&1; then
            git merge --abort >/dev/null 2>&1 || true
            note "เมิจ main เข้าได้ไม่ชน — ไม่ต้องทำอะไร"
            exit 0
          fi

          mapfile -d '' -t conflicted < <(git diff --name-only --diff-filter=U -z)
          if [ "${#conflicted[@]}" -eq 0 ]; then
            echo "::error::#$num เมิจล้มแต่ไม่มีไฟล์ชน — ไม่ใช่ conflict ธรรมดา"
            exit 1
          fi

          # ไฟล์ที่ชนต้องเป็น .html ของแอปทุกไฟล์ — ไฟล์อื่นไม่มีเลขรุ่นให้แก้
          others=()
          for f in "${conflicted[@]}"; do
            if [[ "$f" != *.html || "$f" == */lib/* ]]; then others+=("$f"); fi
          done

          if [ "${#others[@]}" -eq 0 ]; then
            set +e
            out=$(node "$TRUSTED" "${conflicted[@]}" 2>&1)
            rc=$?
            set -e
          else
            out="มีไฟล์ที่ไม่ใช่ .html ของแอปชนด้วย: ${others[*]}"
            rc=2
          fi
          echo "$out"

          if [ "$rc" -ne 0 ]; then
            git merge --abort >/dev/null 2>&1 || true
            marker="<!-- ชนเลขรุ่น-แก้เองไม่ได้ head=${head_sha:0:7} -->"
            # ห้ามเขียนเป็น gh ... | grep -q — grep ออกก่อน gh โดน SIGPIPE
            # แล้ว pipefail ทำให้ได้ผลว่า "ไม่เจอ" ทั้งที่เจอ = คอมเมนต์ซ้ำทุก 30 นาที
            # gh api --paginate ไม่ใช่ gh pr view --json comments — อย่างหลังมีเพดานจำนวนคอมเมนต์
            # PR ที่วนตรวจ-แก้หลายรอบมีคอมเมนต์เยอะ ถ้า marker อยู่เกินเพดานจะมองไม่เห็น
            # แล้วคอมเมนต์ซ้ำทุก 30 นาที
            bodies=$(gh api --paginate "repos/$REPO/issues/$num/comments" --jq '.[].body')
            if grep -qF -- "$marker" <<< "$bodies"; then
              note "ชนเรื่องอื่นด้วย แก้เองไม่ได้ (เคยคอมเมนต์บอกแล้วที่ commit นี้)"
              exit 0
            fi
            {
              echo "<!-- agent-note: ไม่นับเป็นรอบตอบ -->"
              echo "⚠️ **ใบนี้ชนกับ \`main\` และแก้อัตโนมัติไม่ได้**"
              echo ""
              echo "ตัวแก้อัตโนมัติแก้ให้เฉพาะตอนที่ชน **แค่บรรทัด \`app-version\`** เท่านั้น"
              echo "ใบนี้ชนเรื่องอื่นด้วย จึงไม่แตะอะไรเลย — ต้องเลือกเองว่าจะเก็บโค้ดฝั่งไหน"
              echo ""
              echo '```'
              echo "$out"
              echo '```'
              echo ""
              echo "เมิจ \`main\` เข้า branch แล้วแก้จุดที่ชน · ถ้ามีบรรทัด \`app-version\` ชนด้วย"
              echo "ให้ใช้เลขที่ใหม่กว่าของ \`main\` (INVARIANTS F4)"
              echo ""
              echo "$marker"
            } > "$RUNNER_TEMP/refuse-$num.md"
            gh pr comment "$num" -R "$REPO" --body-file "$RUNNER_TEMP/refuse-$num.md"
            note "ชนเรื่องอื่นด้วย แก้เองไม่ได้ — คอมเมนต์บอกแล้ว"
            exit 0
          fi

          if [ -z "${PUSH_TOKEN:-}" ]; then
            git merge --abort >/dev/null 2>&1 || true
            echo "::error::#$num แก้ได้แต่ push ไม่ได้ — ไม่มี secret AGENT_PUSH_PAT"
            exit 1
          fi

          git add -- "${conflicted[@]}"
          left=$(git diff --name-only --diff-filter=U)
          if [ -n "$left" ]; then
            echo "::error::#$num แก้แล้วยังเหลือไฟล์ชน: $left"
            exit 1
          fi
          # ด่านสุดท้ายก่อน push — ยืนยันจากไฟล์จริงว่าไม่มี marker หลงเหลือ
          if grep -lE '^(<{7}|>{7})( |$)' -- "${conflicted[@]}"; then
            echo "::error::#$num ยังมี marker ของ conflict ค้างในไฟล์"
            exit 1
          fi

          # ข้อความ commit ส่งผ่าน printf %s ลงไฟล์ ไม่ใช่ heredoc
          # $out มีชื่อไฟล์จาก branch ของ PR ปนอยู่ · heredoc แบบไม่มี quote ไม่ขยายค่าของตัวแปรซ้ำก็จริง
          # (พิสูจน์แล้ว 10 ก.ย. 2026) แต่คนอ่านต้องหยุดคิดทุกครั้งใน step ที่ถือ PAT — เขียนแบบที่ไม่ต้องคิด
          printf 'เมิจ main เข้ามา แก้ conflict ที่ชนแค่บรรทัด app-version\n\n%s\n\nแก้โดย workflow version-conflict.yml — ไม่มีการเปลี่ยนแปลงอื่นนอกจากการเมิจ main\n' "$out" > "$RUNNER_TEMP/msg-$num.txt"
          git commit -q -F "$RUNNER_TEMP/msg-$num.txt"

          if ! git push -q "https://x-access-token:${PUSH_TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/${head}"; then
            now_sha=$(git ls-remote "https://github.com/${REPO}.git" "refs/heads/${head}" | cut -f1)
            if [ -n "$now_sha" ] && [ "$now_sha" != "$head_sha" ]; then
              note "branch ขยับระหว่างแก้ — ไม่ทับ รอรอบหน้า"
              exit 0
            fi
            echo "::error::#$num push ไม่ผ่านทั้งที่ branch ไม่ได้ขยับ — ตรวจสิทธิ์ของ AGENT_PUSH_PAT"
            exit 1
          fi
          new_sha=$(git rev-parse HEAD)

          {
            echo "<!-- agent-note: ไม่นับเป็นรอบตอบ -->"
            echo "🔀 **แก้ conflict ของเลขรุ่นให้แล้ว**"
            echo ""
            echo "ใบนี้ชนกับ \`main\` แค่บรรทัด \`app-version\` — เมิจ \`main\` (\`${MAIN_SHA:0:7}\`)"
            echo "เข้ามาแล้วที่ \`${new_sha:0:7}\` ไม่มีการเปลี่ยนแปลงอื่น"
            echo ""
            echo '```'
            echo "$out"
            echo '```'
            echo ""
            echo "ด่านทั้งหมดกำลังรันใหม่บน commit นี้"
            echo ""
            echo "ถ้ามี session หรือ agent ทำงานกับ branch นี้อยู่ ต้อง \`git pull\` ก่อน push ครั้งถัดไป"
          } > "$RUNNER_TEMP/fixed-$num.md"
          gh pr comment "$num" -R "$REPO" --body-file "$RUNNER_TEMP/fixed-$num.md"
          note "แก้แล้ว push ที่ ${new_sha:0:7}"
          EOS

          errors=0
          while IFS=$'\t' read -r num head fork; do
            echo "::group::#$num  $head"
            if ! bash "$RUNNER_TEMP/one-pr.sh" "$num" "$head" "$fork"; then
              errors=$((errors + 1))
              printf '#%s\t%s\n' "$num" "ล้มโดยไม่คาดคิด — ดู log ของกลุ่มนี้" >> "$RESULTS"
            fi
            echo "::endgroup::"
          done < <(jq -r '.[] | [.number, .headRefName, .isCrossRepository] | @tsv' <<< "$prs")

          {
            echo "### แก้ชนเลขรุ่น · main @ ${MAIN_SHA:0:7}"
            echo ""
            echo "| PR | ผล |"
            echo "|---|---|"
            while IFS=$'\t' read -r n r; do echo "| $n | $r |"; done < "$RESULTS"
          } >> "$GITHUB_STEP_SUMMARY"

          # ล้มแบบไม่คาดคิดต้องขึ้นแดง — ใบที่ข้ามหรือแก้เองไม่ได้ไม่ใช่ความล้มเหลว
          if [ "$errors" -gt 0 ]; then
            echo "::error::มี $errors ใบที่ล้มโดยไม่คาดคิด"
            exit 1
          fi
