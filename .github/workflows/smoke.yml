name: Smoke tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# ยกเลิกรอบเก่าถ้ามี push ใหม่เข้ามาใน PR เดียวกัน
concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ถ้าแก้ไฟล์แอปแล้วลืมบัมป์เวอร์ชัน เครื่องที่ cache ไว้จะไม่มีทางรู้ว่ามีของใหม่
  # กฎแบบนี้ถ้าไม่บังคับด้วยเครื่อง เดี๋ยวก็ลืม — ให้ CI เป็นคนจำแทน
  version-bump:
    name: ตรวจว่าบัมป์ app-version แล้ว
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: เทียบเวอร์ชันกับ base branch
        run: |
          set -euo pipefail
          BASE="origin/${{ github.base_ref }}"
          git fetch --quiet origin "${{ github.base_ref }}"

          if ! git diff --name-only "$BASE...HEAD" | grep -qx 'Stock-log.html'; then
            echo "PR นี้ไม่ได้แก้ Stock-log.html — ข้ามการตรวจ"
            exit 0
          fi

          ver() { grep -o '<meta name="app-version" content="[^"]*"' | head -1 | sed 's/.*content="//; s/"$//'; }
          NEW=$(ver < Stock-log.html || true)
          OLD=$(git show "$BASE:Stock-log.html" | ver || true)

          echo "เวอร์ชันบน ${{ github.base_ref }} : ${OLD:-(ไม่พบ)}"
          echo "เวอร์ชันใน PR นี้            : ${NEW:-(ไม่พบ)}"

          if [ -z "$NEW" ]; then
            echo '::error file=Stock-log.html::ไม่พบ <meta name="app-version"> ในไฟล์'
            exit 1
          fi
          if [ "$OLD" = "$NEW" ]; then
            echo "::error file=Stock-log.html::แก้ Stock-log.html แล้วแต่ไม่ได้บัมป์ app-version (ยังเป็น $NEW) — เครื่องที่ cache ไฟล์เก่าไว้จะไม่รู้ว่ามีของใหม่ ดู INVARIANTS B4"
            exit 1
          fi
          echo "✓ บัมป์เวอร์ชันแล้ว: $OLD → $NEW"

  smoke:
    name: ตรวจกฎใน INVARIANTS.md
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ไม่ใช้ npm ci เพราะ repo นี้ไม่มี package-lock.json
      # (ตั้งใจ — แอปจริงไม่มี dependency, package.json มีไว้ให้ตัวเทสเท่านั้น)
      - name: ติดตั้ง dependency ของเทส
        run: npm install --no-audit --no-fund

      - name: ติดตั้งเบราว์เซอร์
        run: npx playwright install --with-deps chromium

      - name: รัน smoke test
        run: npm test

      - name: เก็บผลไว้ดูตอน fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
