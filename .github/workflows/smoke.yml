name: Smoke tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# ยกเลิกรอบเก่าถ้ามี push ใหม่เข้ามาใน PR เดียวกัน
concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ถ้าแก้ไฟล์แอปแล้วลืมบัมป์เวอร์ชัน เครื่องที่ cache ไว้จะไม่มีทางรู้ว่ามีของใหม่
  # กฎแบบนี้ถ้าไม่บังคับด้วยเครื่อง เดี๋ยวก็ลืม — ให้ CI เป็นคนจำแทน
  version-bump:
    name: ตรวจว่าบัมป์ app-version แล้ว
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: เทียบเวอร์ชันกับ base branch
        run: |
          set -euo pipefail
          BASE="origin/${{ github.base_ref }}"
          git fetch --quiet origin "${{ github.base_ref }}"
          CHANGED=$(git diff --name-only "$BASE...HEAD")

          ver() { grep -o '<meta name="app-version" content="[^"]*"' | head -1 | sed 's/.*content="//; s/"$//'; }

          # ตรวจทุกไฟล์แอปในโปรเจกต์ ไม่ใช่แค่โฟลเดอร์บนสุด
          # เดิมวนแค่ *.html ชั้นบนสุด ทำให้ v2/index.html หลุดการตรวจไปทั้งตัว
          # เพิ่มแอปใหม่ที่ไหนก็ถูกตรวจเอง — กฎที่ต้องจำว่าให้ไปเติม คือกฎที่จะลืม
          FAIL=0
          FOUND=0
          for APP in $(git ls-files '*.html' | grep -v '/lib/'); do
            echo "$CHANGED" | grep -qxF "$APP" || continue
            FOUND=1

            NEW=$(ver < "$APP" || true)
            OLD=$(git show "$BASE:$APP" 2>/dev/null | ver || true)
            echo "── $APP"
            echo "   บน ${{ github.base_ref }} : ${OLD:-(ไม่พบ)}"
            echo "   ใน PR นี้        : ${NEW:-(ไม่พบ)}"

            if [ -z "$NEW" ]; then
              echo "::error file=$APP::ไม่พบ <meta name=\"app-version\"> ในไฟล์ — ผู้ใช้จะบอกไม่ได้ว่าเครื่องตัวเองรันรุ่นไหน (INVARIANTS F4)"
              FAIL=1
            elif [ "$OLD" = "$NEW" ]; then
              echo "::error file=$APP::แก้ $APP แล้วแต่ไม่ได้บัมป์ app-version (ยังเป็น $NEW) — เครื่องที่ cache ไฟล์เก่าไว้จะไม่รู้ว่ามีของใหม่ ดู INVARIANTS B4"
              FAIL=1
            else
              echo "   ✓ บัมป์แล้ว: ${OLD:-(ไม่มี)} → $NEW"
            fi
          done

          # ห้ามเขียนเป็น `[ ... ] && echo` — ภายใต้ set -e ถ้าเงื่อนไขเป็นเท็จ
          # AND-list จะคืนค่า 1 และทำให้ step ล้มทั้งที่ทุกอย่างถูกต้อง
          if [ "$FOUND" -eq 0 ]; then
            echo "PR นี้ไม่ได้แก้ไฟล์แอป — ข้ามการตรวจ"
          fi
          exit "$FAIL"

  smoke:
    name: ตรวจกฎใน INVARIANTS.md
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ไม่ใช้ npm ci เพราะ repo นี้ไม่มี package-lock.json
      # (ตั้งใจ — แอปจริงไม่มี dependency, package.json มีไว้ให้ตัวเทสเท่านั้น)
      - name: ติดตั้ง dependency ของเทส
        run: npm install --no-audit --no-fund

      # ═══════════════════════════════════════════════════════════════
      # 🛑 9 ก.ย. 2026 — ขั้นนี้ล้มสามรอบติดโดยไม่เกี่ยวกับโค้ดใน repo เลย
      #
      #   E: Failed to fetch https://dl.google.com/linux/chrome-stable/deb/...
      #      /Packages.gz  Hash Sum mismatch
      #   Failed to install browsers · Installation process exited with code: 100
      #
      # ต้นเหตุคือ --with-deps เรียก apt-get update ซึ่งไปอ่าน repo ของ Google Chrome
      # ที่ติดมากับเครื่อง runner **เราไม่ได้ใช้ Chrome ตัวนั้นเลย** แต่ apt ล้มทั้งคำสั่ง
      #
      # ผลคือด่านที่บังคับว่า PR ทุกใบต้องผ่าน กลายเป็นแดงถาวรจากเรื่องนอก repo
      # ซึ่งแปลว่า **merge อะไรไม่ได้เลยทั้ง repo** จนกว่าฝั่ง Google จะหาย
      #
      # ทางแก้: ถ้าติดตั้งพร้อม deps ไม่ได้ ให้ลองแบบไม่เอา deps
      # เครื่อง ubuntu-latest ของ GitHub มี lib ที่ chromium ต้องใช้มาให้อยู่แล้ว
      # ถ้าขาดจริง chromium จะเปิดไม่ขึ้นแล้วเทสแดงพร้อมข้อความของตัวเอง
      # — ดังกว่าและตรงจุดกว่าการล้มที่ขั้นติดตั้ง
      # ═══════════════════════════════════════════════════════════════
      - name: ติดตั้งเบราว์เซอร์
        run: |
          npx playwright install --with-deps chromium || {
            echo "::warning::ติดตั้งพร้อม deps ไม่สำเร็จ (มักเป็น apt repo ของ Google ล่ม) — ลองแบบไม่เอา deps"
            npx playwright install chromium
          }

      - name: รัน smoke test
        run: npm test

      - name: เก็บผลไว้ดูตอน fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
