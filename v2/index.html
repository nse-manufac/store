              <label for="au" style="font-size:13px">ซิงค์เองทุก 2 นาที และทันทีที่เน็ตกลับมา</label>
            </span>
            <div class="grow"></div>
            <button class="btn" @click="testConnection" :disabled="!sync.url">ทดสอบการเชื่อมต่อ</button>
            <button class="btn primary" @click="syncNow(false)" :disabled="!sync.url || sync.state==='busy'">
              ซิงค์เดี๋ยวนี้</button>
          </div>

          <div class="msg ok" v-if="fromLink" style="margin:12px 0 0">
            รับค่าตั้งค่ามาจากลิงก์แล้ว — เครื่องนี้ไม่ต้องกรอกอะไรเพิ่ม
          </div>

          <!-- แจกลิงก์เดียวแล้วทุกเครื่องเปิดใช้ได้เลย ไม่ต้องเดินไปกรอกทีละเครื่อง -->
          <div class="row" style="margin-top:12px" v-if="sync.url">
            <button class="btn" @click="copyShareLink">คัดลอกลิงก์ตั้งค่าไปเครื่องอื่น</button>
            <span class="hint" v-if="linkCopied">{{ linkCopied }}</span>
            <span class="hint" v-else>เปิดลิงก์นี้ในเครื่องใหม่แล้วมันจะตั้งค่าให้เอง</span>
          </div>
          <div v-if="linkCopied" style="margin-top:8px">
            <input :value="shareLink" readonly class="mono" style="width:100%;font-size:12px"
                   @focus="$event.target.select()">
            <p class="hint" style="margin:6px 0 0">
              ⚠️ ในลิงก์มีรหัสผ่านอยู่ ส่งในไลน์กลุ่มของทีมได้ แต่อย่าเอาไปโพสต์ที่สาธารณะ
            </p>
          </div>

          <div class="msg ok" v-if="sync.msg && sync.state!=='error'" style="margin:12px 0 0">
            {{ sync.msg }}</div>
          <div class="msg bad" v-if="wiringGap.length" style="margin:12px 0 0">
            <b>โปรแกรมรุ่นนี้มีบั๊ก — ตาราง {{ wiringGap.join(' · ') }} ยังไม่ได้ต่อสายกับข้อมูลในเครื่อง</b><br>
            <span class="hint">ไม่ใช่ปัญหาการตั้งค่าของคุณ ซิงค์จะพังทุกครั้งจนกว่าจะแก้ที่โปรแกรม</span>
          </div>

          <div class="msg bad" v-if="sync.error" style="margin:12px 0 0">
            {{ sync.error }}
            <div v-if="sync.needDeploy" style="margin-top:6px">
              <b>เซิร์ฟเวอร์ยังเป็นสคริปต์รุ่นเก่า</b><br>
              <span class="hint">เปิดสเปรดชีต → ส่วนขยาย → Apps Script → วางไฟล์
                v2/sync/apps-script.gs ทับ → Deploy → Manage deployments → กดดินสอ →
                Version: New version → Deploy<br>
                URL เดิมไม่เปลี่ยน ไม่ต้องมาแก้ช่องข้างบนนี้</span>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="row">
            <h2 style="margin:0">ของที่รอส่งขึ้น</h2>
            <div class="grow"></div>
            <span class="hint" v-if="sync.lastOkAt">ซิงค์สำเร็จล่าสุด {{ localDate(sync.lastOkAt) }}
              {{ localTime(sync.lastOkAt) }}</span>
            <span class="hint" v-else>ยังไม่เคยซิงค์สำเร็จ</span>
          </div>
          <div class="row" style="margin-top:12px;gap:28px">
            <div v-for="(def,k) in TABLES" :key="k">
              <div class="hint">{{ def.label }}</div>
              <div class="big" :class="pending.per[k]?'warn':''">{{ pending.per[k] || 0 }}</div>
            </div>
          </div>
          <p class="hint" style="margin:12px 0 0">
            ตัวเลขนี้คือของที่ยังอยู่แค่ในเครื่องนี้ ไม่ได้แปลว่าผิด — คีย์ได้ตามปกติแม้เน็ตหลุด
            แล้วมันจะทยอยส่งขึ้นเองเมื่อเน็ตกลับมา
          </p>
          <div class="row" style="margin-top:12px">
            <div class="grow"></div>
            <button class="btn" @click="pushAll" :disabled="!sync.url || sync.state==='busy'">
              ส่งขึ้นใหม่ทั้งหมด</button>
            <button class="btn" @click="resync" :disabled="!sync.url || sync.state==='busy'">
              ดึงใหม่ทั้งหมดจากเซิร์ฟเวอร์</button>
          </div>
        </div>

        <div class="card">
          <h2>เปิดใช้ครั้งแรกต้องทำอะไรบ้าง</h2>
          <ol class="hint" style="margin:0;padding-left:20px;line-height:1.9">
            <li>สร้าง <b>สเปรดชีตใหม่</b> แยกจากของ v1 (ของเดิมเก็บไว้เป็นบันทึกย้อนหลัง ห้ามลบ)</li>
            <li>ส่วนขยาย → Apps Script → วางไฟล์ <span class="mono">v2/sync/apps-script.gs</span> ทั้งไฟล์</li>
            <li>แก้บรรทัด <span class="mono">var TOKEN</span> เป็นรหัสของตัวเอง แล้วกรอกให้ตรงกันในช่องข้างบน</li>
            <li>Deploy → New deployment → Web app → Execute as: <b>Me</b> ·
                Who has access: <b>Anyone</b> → เอา URL ที่ลงท้าย <span class="mono">/exec</span> มาใส่ข้างบน</li>
            <li>กดทดสอบการเชื่อมต่อ ถ้าขึ้นชื่อสเปรดชีตแปลว่าใช้ได้</li>
          </ol>
          <p class="hint" style="margin:10px 0 0">
            รอบถัดไปที่แก้สคริปต์ ให้ใช้ <b>Manage deployments → ดินสอ → New version</b>
            URL จะไม่เปลี่ยน — ถ้ากด New deployment ใหม่ URL จะเปลี่ยนแล้วต้องไล่แก้ทุกเครื่อง
          </p>
        </div>
      </template>

      <div class="card" v-else>
        <p class="empty">หน้านี้ยังไม่ได้ทำ — กำลังสร้างทีละส่วน</p>
      </div>

      <!-- รายการ P/N ใช้ร่วมกันหลายหน้า จึงต้องอยู่นอกแท็บ ไม่งั้นหน้าที่ไม่ได้เปิดจะหาไม่เจอ -->
      <datalist id="pnlist"><option v-for="p in bomPnCodes" :key="p" :value="p"></option></datalist>
      <datalist id="scrappolist"><option v-for="p in scrapPos" :key="p.po" :value="p.po">{{ p.pn ? 'P/N ' + p.pn : '' }}</option></datalist>

      <!-- ════════ ตั้งทะเบียนจาก BOM ════════ -->
      <!-- มีอะไรใหม่ — บังคับเลื่อนอ่านจนจบ + ติ๊กก่อนปิด · ไม่มี @click.self โดยตั้งใจ (เจ้าของสั่ง 24 ก.ย. 2026) -->
      <div class="modal" v-if="notice.open" style="z-index:60">
        <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="noticeTitle">
          <!-- ห้ามพิมพ์เลขรุ่นซ้ำตรงนี้ (INVARIANTS F4 — เลขรุ่นอยู่ที่ <meta app-version> ที่เดียว) -->
          <h2 id="noticeTitle" style="margin:0 0 8px">🆕 มีอะไรใหม่ — over รอคืน: ปุ่ม "คืนของ" (27 พ.ย. 2026)</h2>
          <div class="notice-body" ref="noticeBox" tabindex="0" @scroll="noticeScroll">
            <h3>over รอคืน: ปุ่ม "คืนแล้ว" เปลี่ยนเป็น "คืนของ"</h3>
            <p>Mat Follow up → over รอคืน → ปุ่มกรอง <b>รอคืน</b> · กด <b>คืนของ</b> แล้วเลือกแบบในหน้าต่าง</p>
            <p><b>1 · คืน Delta</b> — ใส่ผู้คืน · วันที่คืน · จำนวน · เพราะอะไร → ของออกจากคลัง</p>
            <p><b>2 · ทดแทน short ที่ค้าง</b> — ใส่ยอดในแถว PO ของเรื่อง short ที่จะเอาไปทดแทน →
              ของไม่ออกจากคลัง · เรื่อง short ลดยอดค้างให้เอง</p>
            <p>⚠️ ของ over ที่เอาไปใช้แทน short <b>ห้ามกด "มาแล้ว"</b> ที่หน้า short รอส่ง — ใช้ <b>คืนของ</b> แบบ 2 แทน
              ไม่งั้นยอดคลังเพิ่มซ้ำ</p>
            <h3>short รอส่ง: กด "มาแล้ว" = รับเข้าคลังทุกครั้ง</h3>
            <p>ไม่มีช่องติ๊ก "รับเข้าคลังด้วย" แล้ว · ของที่คีย์รับเข้าไปแล้ว (เช่นมากับ Kit List) ให้กด <b>ยกเลิกเรื่อง</b> แทน</p>
          </div>
          <div class="row" style="margin-top:12px;gap:12px">
            <label :class="notice.atEnd ? '' : 'hint'">
              <input type="checkbox" v-model="notice.ack" :disabled="!notice.atEnd"> อ่านและเข้าใจแล้ว</label>
            <div class="grow"></div>
            <button class="btn primary" :disabled="!noticeCanClose(notice)" @click="closeNotice">
              อ่านแล้ว ปิดหน้าต่างนี้</button>
          </div>
          <p class="hint" style="margin:6px 0 0" v-if="!noticeCanClose(notice)">
            {{ notice.atEnd ? 'ติ๊ก “อ่านและเข้าใจแล้ว” ก่อนปิด'
                            : 'เลื่อนอ่านให้ถึงล่างสุดก่อน (ลูกศรลง หรือ Page Down ได้)' }}</p>
        </div>
      </div>

      <div class="modal" v-if="regDraft" @click.self="regDraft=null">
        <div class="modal-box" style="width:min(1100px,100%)">
          <div class="row">
            <h2 style="margin:0">ตั้งทะเบียนจาก BOM</h2>
            <div class="grow"></div>
            <span class="hint">เลือกไว้ {{ regTake.length }} จาก {{ regDraft.length }}</span>
            <button class="btn" @click="regDraft=null">ปิด</button>
          </div>

          <p class="hint" style="margin:8px 0">
            ทุกตัวจะถูกติดธง <b>รอตรวจ</b> ไว้ เพราะ BOM บอกวันหมดอายุไม่ได้ และหมวดเป็นแค่การเดาจากชื่อ
            — หมวด CHEMICAL จะถูกตั้งให้ต้องกรอกวันหมดอายุอัตโนมัติ
          </p>

          <div class="msg warn" v-if="regPlan.unitVaries || regPlan.noUnit || regPlan.dupDesc">
            <span v-if="regPlan.unitVaries"><b>{{ regPlan.unitVaries }} รหัสมีหน่วยไม่ตรงกันข้าม P/N</b>
              — ต้องดูก่อนว่าจะเอาหน่วยไหน เพราะตัวเลขในสูตรจะคนละมาตราส่วน<br></span>
            <span v-if="regPlan.noUnit">{{ regPlan.noUnit }} รหัสไม่มีหน่วยใน BOM เลย<br></span>
            <span v-if="regPlan.dupDesc">{{ regPlan.dupDesc }} รหัสมีชื่อซ้ำกับรหัสที่มีอยู่แล้วในทะเบียน
              — เช็กว่าไม่ใช่ของเดียวกันคนละรหัส (issue #26)</span>
          </div>
          <div class="msg ok" v-if="regPlan.inHouseSkipped.length">
            ข้ามของที่เราทำเอง {{ regPlan.inHouseSkipped.length }} รหัสให้แล้ว
            <span class="mono hint">{{ regPlan.inHouseSkipped.slice(0,5).join(' · ') }}</span><br>
            <span class="hint">พวกนี้คืองานที่เราพันเอง ไม่ใช่ของที่ซื้อเข้ามา ไม่ควรอยู่ในทะเบียนวัตถุดิบ</span>
          </div>

          <div class="scroll" style="margin-top:10px;max-height:50vh">
            <table>
              <thead><tr>
                <th style="width:34px"></th><th style="width:115px">รหัส</th><th>ชื่อ</th>
                <th style="width:70px">หน่วย</th><th style="width:130px">หมวด</th>
                <th style="width:200px">ใช้ใน P/N</th>
              </tr></thead>
              <tbody>
                <tr v-for="r in regDraft" :key="r.code" :class="{review: r.unitVaries || r.dupDesc.length}">
                  <td><input type="checkbox" v-model="r.take" style="width:16px;height:16px"></td>
                  <td class="mono"><b>{{ r.code }}</b></td>
                  <td>
                    <input v-model.trim="r.desc" style="width:100%;font-size:13px">
                    <div class="hint" v-if="r.descVaries">
                      ชื่ออื่นที่พบ: <span class="mono">{{ r.otherDescs.join(' · ') }}</span></div>
                    <div class="hint" v-if="r.dupDesc.length">
                      <span class="tag warn">ชื่อซ้ำกับ {{ r.dupDesc.join(' · ') }}</span></div>
                  </td>
                  <td>
                    <input v-model.trim="r.unit" class="mono" style="width:58px">
                    <div v-if="r.unitVaries"><span class="tag bad">พบ {{ r.units.join('/') }}</span></div>
                    <div v-if="r.noUnit"><span class="tag warn">ไม่มีหน่วย</span></div>
                  </td>
                  <td>
                    <select v-model="r.category" style="width:118px;font-size:12px">
                      <option v-for="c in CATEGORIES" :key="c" :value="c">{{ c }}</option>
                    </select>
                  </td>
                  <td class="mono hint">{{ r.pns.join(' ') }}
                    <span v-if="r.nPn > r.pns.length">… รวม {{ r.nPn }}</span></td>
                </tr>
              </tbody>
            </table>
          </div>

          <div class="row" style="margin-top:12px">
            <button class="btn" @click="regDraft.forEach(r => r.take = true)">เลือกทั้งหมด</button>
            <button class="btn" @click="regDraft.forEach(r => r.take = false)">ไม่เลือกเลย</button>
            <div class="grow"></div>
            <button class="btn primary" @click="applyRegPlan" :disabled="regBusy || !regTake.length">
              {{ regBusy ? 'กำลังเพิ่ม...' : 'เพิ่ม ' + regTake.length + ' รหัสเข้าทะเบียน' }}</button>
          </div>
        </div>
      </div>

      <!-- ════════ ยกเลิกรายการ ════════ -->
      <div class="modal" v-if="voidBox.row" @click.self="voidBox.row=null">
        <div class="modal-box" style="width:min(520px,100%)">
          <h2>ยกเลิกรายการนี้</h2>
          <p class="hint" style="margin:-4px 0 10px">
            รายการจะไม่ถูกลบ แต่จะไม่นับเข้ายอด และยังเห็นได้ในการ์ดว่าใครยกเลิกเพราะอะไร
            — สมุดเขียนเพิ่มได้อย่างเดียว
          </p>
          <table><tbody>
            <tr><td class="hint" style="width:90px">วันที่</td>
                <td class="mono">{{ localDate(voidBox.row.at) }}</td></tr>
            <tr><td class="hint">รายการ</td>
                <td>{{ voidBox.row.kindLabel }} <b class="mono">{{ voidBox.row.qty }}</b>
                    <span class="mono hint">{{ voidBox.row.lot ? '· ล็อต ' + voidBox.row.lot : '' }}</span></td></tr>
            <tr><td class="hint">ผู้บันทึก</td><td>{{ voidBox.row.person }}</td></tr>
          </tbody></table>
          <p class="hint" v-if="voidTwins.length" style="margin:12px 0 0">รายการล้างเศษ PO {{ voidTwins[0].doc_ref }}
            (ส่วนต่าง {{ voidTwins[0].delta }}<template v-if="voidTwins.length > 1"> และอีก {{ voidTwins.length - 1 }} รายการ</template>)
            ที่ทำตอนหรือหลังจ่ายออกรายการนี้ จะถูกยกเลิกไปด้วย · ถ้ายังเหลือเศษจริง ปุ่มล้างเศษจะกลับมาที่หน้ายอดคงคลัง</p>
          <!-- คู่ทดแทน short ของ "คืนของ แบบ 2" — ยกเลิกข้างเดียวแล้วคงคลังเพี้ยน (ผู้ตรวจ #199 รอบ 3) -->
          <div class="msg warn" v-if="voidPairs.length" style="margin:12px 0 0">
            <b>รายการนี้เป็นคู่ทดแทน short</b> — คู่กับ{{ voidPairs[0].kind === 'receive' ? 'รับเข้า' : 'ส่งคืน' }}
            <b class="mono">{{ voidPairs[0].qty }}</b> ของ PO <b class="mono">{{ voidPairs[0].doc_ref }}</b><br>
            <span class="hint">ยกเลิกแล้วระบบจะยกเลิก<b>อีกใบที่คู่กันไปด้วย</b> คงคลังจึงไม่ขยับ
              — ถ้ายกเลิกใบเดียว ของ {{ voidPairs[0].qty }} หน่วยจะงอกหรือหายจากคลังโดยไม่มีอะไรฟ้อง
              · ถ้าต้องการเปิดเรื่อง over / short กลับมาด้วย ให้กดปุ่ม <b>เอากลับ</b> ที่หน้า over หรือ short แทน</span>
          </div>
          <div class="msg warn" v-if="voidAfterAdjust" style="margin:12px 0 0">
            <b>รายการนี้อยู่ก่อนการปรับยอดวันที่ {{ localDate(voidAfterAdjust.at) }}</b><br>
            <!-- ล้างเศษไม่ได้นับจริง — ห้ามเขียน "ที่เคยนับได้ 0" (ผู้ตรวจ #185) -->
            <span class="hint" v-if="isFracAdj(voidAfterAdjust)">รายการนั้นคือ <b>ล้างเศษ PO {{ voidAfterAdjust.doc_ref }}</b> ที่ระบบทำเอง
              (ส่วนต่าง {{ voidAfterAdjust.delta }} แช่แข็งไว้ตั้งแต่ตอนบันทึก) — ยกเลิกรายการนี้แล้วยอดของ PO นั้นจะไม่เป็นศูนย์
              ถ้าจะให้กลับเหมือนก่อนล้าง ให้ยกเลิกรายการล้างเศษนั้นด้วย (อยู่ในการ์ดของรหัสนี้)</span>
            <span class="hint" v-else>ส่วนต่างของการปรับยอดถูกแช่แข็งไว้ตั้งแต่ตอนบันทึกและจะไม่คำนวณใหม่
              ยกเลิกแล้วยอดคงเหลือจะไม่ตรงกับ {{ voidAfterAdjust.counted_qty }} ที่เคยนับได้อีก
              — ถ้าของจริงยังเท่าเดิม ให้ปรับยอดอีกครั้งหลังยกเลิก</span>
          </div>

          <div class="row" style="margin-top:12px">
            <label class="f grow">ยกเลิกเพราะอะไร
              <input v-model="voidBox.reason" placeholder="เช่น คีย์จำนวนผิด คีย์ซ้ำ"></label>
            <label class="f" style="width:150px">ใครสั่งยกเลิก
              <input v-model="voidBox.by"></label>
          </div>
          <div class="row" style="margin-top:12px">
            <div class="grow"></div>
            <button class="btn" @click="voidBox.row=null">ไม่ยกเลิกแล้ว</button>
            <button class="btn primary" @click="doVoid"
                    :disabled="!voidBox.reason.trim() || !voidBox.by.trim()">ยืนยันยกเลิก</button>
          </div>
        </div>
      </div>

      <!-- ════════ จ่ายออกทีละ PO จากหน้ายอดคงคลัง (เจ้าของสั่ง 25 พ.ย. 2026) ════════
           กฎ: จ่ายสะสมของ PO นี้ไม่เกิน BOM · ครั้งนี้ไม่เกินของที่ PO นี้รับเข้ามาแล้วยังเหลือ — poIssueCheck (master/mrp.js)
           โชว์ตัวเลขที่ใช้ตัดสินทุกตัว ให้เห็นว่าทำไมจ่ายได้แค่นั้น -->
      <div class="modal" v-if="bpIss.open" @click.self="bpIss.open=false">
        <div class="modal-box" style="width:min(560px,100%)" role="dialog" aria-modal="true">
          <h2>จ่ายออก</h2>
          <table><tbody>
            <tr><td class="hint" style="width:150px">P/N</td><td class="mono">{{ bpIss.pn || 'ไม่รู้ P/N' }}</td></tr>
            <tr><td class="hint">PO</td><td class="mono"><b>{{ bpIss.po }}</b>
              <span class="hint" v-if="bpIssRow && bpIssRow.date"> · PO Date {{ bpIssRow.date }}</span></td></tr>
            <tr><td class="hint">วัตถุดิบ</td><td><span class="mono">{{ bpIss.code }}</span> {{ (matOf(bpIss.code) || {}).description || '' }}</td></tr>
          </tbody></table>
          <p v-if="!bpIssRow" class="msg bad" style="margin:10px 0 0">ไม่พบ PO นี้ในหน้ายอดคงคลังแล้ว (อาจถูกซ่อนเพราะปิดไปแล้ว) — ปิดกล่องแล้วกดใหม่</p>
          <template v-else>
            <table style="margin-top:10px"><tbody>
              <tr><td class="hint" style="width:150px">ตาม BOM ของ PO นี้</td>
                <td class="mono r">{{ bpIssRow.need == null ? 'ไม่รู้' : mrpNum(bpIssRow.need) }}</td></tr>
              <tr><td class="hint">จ่ายไปแล้ว</td><td class="mono r">{{ mrpNum(bpIssRow.issued) }}</td></tr>
              <tr><td class="hint">จ่ายได้อีกตาม BOM</td>
                <td class="mono r">{{ bpIssChk.bomLeft == null ? 'ไม่จำกัด (ไม่รู้ยอดตาม BOM)' : mrpNum(Math.max(0, bpIssChk.bomLeft)) }}</td></tr>
              <tr><td class="hint">รับเข้า PO นี้</td><td class="mono r">{{ mrpNum(bpIssRow.recv) }}
                <span v-if="bpIssRow.sendback" class="bp-sb" style="display:inline;margin-left:6px">ส่งคืน Delta {{ mrpNum(bpIssRow.sendback) }}</span></td></tr>
              <tr><td class="hint">คงเหลือ PO นี้</td><td class="mono r">{{ mrpNum(bpIssRow.bal) }}</td></tr>
              <tr><td class="hint"><b>จ่ายได้สูงสุดครั้งนี้</b></td>
                <td class="mono r"><b>{{ mrpNum(bpIssChk.max) }}</b> <span class="hint">{{ unitOf(bpIss.code) }}</span></td></tr>
            </tbody></table>
            <div class="row" style="margin-top:12px">
              <label class="f" style="width:150px">วันที่<input v-model="bpIss.date" type="date" :max="todayLocal()"></label>
              <label class="f grow">ชื่อผู้จ่าย<input v-model.trim="bpIss.person"></label>
              <label class="f grow">ชื่อผู้เบิก<input v-model.trim="bpIss.requester" data-bpiss-req></label>
              <label class="f" style="width:130px">จำนวนที่จ่าย
                <input v-model.number="bpIss.qty" type="number" step="any" min="0" class="mono" data-bpiss-qty></label>
            </div>
            <div class="msg bad" v-if="bpIssChk.overBom" style="margin:10px 0 0">
              <b>เกิน BOM</b> — จ่ายไปแล้ว {{ mrpNum(bpIssRow.issued) }} + ครั้งนี้ {{ mrpNum(bpIssChk.qty) }}
              = {{ mrpNum(bpIssRow.issued + bpIssChk.qty) }} มากกว่าตาม BOM {{ mrpNum(bpIssRow.need) }}
              · ใส่ได้ไม่เกิน {{ mrpNum(bpIssChk.max) }}</div>
            <div class="msg bad" v-if="bpIssChk.overRecv" style="margin:10px 0 0">
              <b>เกินของที่ PO นี้รับเข้ามา</b> — ครั้งนี้ {{ mrpNum(bpIssChk.qty) }} มากกว่าคงเหลือของ PO นี้ {{ mrpNum(bpIssRow.bal) }}
              · ใส่ได้ไม่เกิน {{ mrpNum(bpIssChk.max) }} หรือคีย์รับเข้าของ PO นี้ให้ครบก่อน</div>
          </template>
          <div class="row" style="margin-top:12px">
            <div class="grow"></div>
            <button class="btn" @click="bpIss.open=false">ไม่จ่ายแล้ว</button>
            <button class="btn primary" @click="bpIssSave"
                    :disabled="!bpIssChk || !bpIssChk.ok || !bpIss.person || !bpIss.requester || !bpIss.date">บันทึกจ่ายออก</button>
          </div>
        </div>
      </div>
      <!-- แก้รายการจ่ายที่เกิน (เจ้าของสั่ง 28 พ.ย. 2026) — กดป้าย "จ่ายเกิน" (เกิน BOM) หรือยอดติดลบ (เกินรับเข้า) บนแถว PO
           เลือกรายการที่ผิด → ใส่จำนวนที่ถูก
           ยกเลิกรายการเดิม (ขีดฆ่าใน Log · B1) แล้วบันทึกจำนวนที่ถูกแทน · ลดได้อย่างเดียว · กฎ poFixCheck (master/mrp.js) -->
      <div class="modal" v-if="bpFix.open" @click.self="bpFix.open=false">
        <div class="modal-box" style="width:min(820px,100%)" role="dialog" aria-modal="true">
          <h2>แก้รายการจ่ายที่เกิน</h2>
          <table><tbody>
            <tr><td class="hint" style="width:150px">P/N</td><td class="mono">{{ bpFix.pn || 'ไม่รู้ P/N' }}</td></tr>
            <tr><td class="hint">PO</td><td class="mono"><b>{{ bpFix.po }}</b>
              <span class="hint" v-if="bpFixRow && bpFixRow.date"> · PO Date {{ bpFixRow.date }}</span></td></tr>
            <tr><td class="hint">วัตถุดิบ</td><td><span class="mono">{{ bpFix.code }}</span> {{ (matOf(bpFix.code) || {}).description || '' }}</td></tr>
          </tbody></table>
          <p v-if="!bpFixRow" class="msg bad" style="margin:10px 0 0">ไม่พบ PO นี้ในหน้ายอดคงคลังแล้ว (อาจถูกซ่อนเพราะปิดไปแล้ว) — ปิดกล่องแล้วกดใหม่</p>
          <template v-else>
            <table style="margin-top:10px"><tbody>
              <tr><td class="hint" style="width:150px">ตาม BOM ของ PO นี้</td>
                <td class="mono r">{{ bpFixRow.need == null ? 'ไม่รู้' : mrpNum(bpFixRow.need) }}</td></tr>
              <tr><td class="hint">จ่ายไปแล้ว</td><td class="mono r">{{ mrpNum(bpFixRow.issued) }}</td></tr>
              <tr><td class="hint"><b>เกิน BOM</b></td>
                <td class="mono r"><b v-if="bpFixRow.issueDiff > 0" style="color:var(--bad)">{{ mrpNum(bpFixRow.issueDiff) }}</b>
                  <span v-else class="hint">{{ bpFixRow.need == null ? 'ไม่รู้ยอดตาม BOM' : 'ไม่เกิน' }}</span></td></tr>
              <tr><td class="hint">รับเข้า PO นี้</td><td class="mono r">{{ mrpNum(bpFixRow.recv) }}
                <span v-if="bpFixRow.sendback" class="bp-sb" style="display:inline;margin-left:6px">ส่งคืน Delta {{ mrpNum(bpFixRow.sendback) }}</span></td></tr>
              <tr><td class="hint"><b>คงเหลือ PO นี้</b></td>
                <td class="mono r"><b :style="bpFixRow.bal < 0 ? 'color:var(--bad)' : ''">{{ mrpNum(bpFixRow.bal) }}</b>
                  <span class="hint" style="margin-left:4px">{{ unitOf(bpFix.code) }}</span>
                  <span v-if="bpFixRow.bal < 0" style="color:var(--bad);margin-left:6px">จ่ายเกินรับเข้า {{ mrpNum(-bpFixRow.bal) }}</span></td></tr>
            </tbody></table>
            <p v-if="bpFixRow.bal < 0" class="msg warn" style="margin:10px 0 0">ถ้ารายการจ่ายถูกแล้ว แต่ยังไม่ได้คีย์รับเข้าของ PO นี้
              ไม่ต้องแก้ที่นี่ — ไปคีย์รับเข้าให้ครบก่อน แล้วยอดติดลบจะหายเอง</p>
            <p style="margin:14px 0 4px"><b>1. เลือกรายการจ่ายที่คีย์ผิด หรือคีย์ซ้ำ</b></p>
            <!-- แถวแดง = รายการที่ทำให้ยอดสะสมเกิน · ป้ายบอกเกินอะไรเท่าไหร่ / ซ้ำกับรายการไหน (เจ้าของสั่ง 28 พ.ย. 2026) · ตรรกะ poOverRows -->
            <p class="hint" style="margin:0 0 6px">แถวสีแดง = ยอดจ่ายสะสมเกินตั้งแต่รายการนี้ (นับตามวันที่) — รายการที่คีย์ผิดจริงอาจเป็นแถวก่อนหน้า ตรวจกับใบเบิกก่อนเลือก</p>
            <table class="mrp" style="margin-top:0"><thead><tr><th style="width:30px"></th><th>วันที่</th><th class="r">จำนวน</th><th class="r">จ่ายสะสม</th>
              <th>ผู้ทำ</th><th>หมายเหตุ</th><th>ทำให้เกิน</th></tr></thead>
              <tbody>
                <tr v-for="x in bpFixRows" :key="x.e.id" style="cursor:pointer" @click="bpFix.id = x.e.id; bpFix.qty = null"
                    :style="x.overBom || x.overRecv || x.dupOf ? 'background:var(--badbg)' : ''" :data-bpfix-row="x.e.id">
                  <td><input type="radio" name="bpfix" :checked="bpFix.id === x.e.id" :data-bpfix-pick="x.e.id"></td>
                  <td class="mono">{{ localDate(x.e.at) }}</td><td class="mono r">{{ mrpNum(x.qty) }}</td>
                  <td class="mono r">{{ mrpNum(x.cum) }}</td>
                  <td>{{ x.e.person }}</td><td style="white-space:normal">{{ x.e.note || '' }}</td>
                  <td style="white-space:normal">
                    <span v-if="x.overBom" class="tag bad" style="margin:1px 2px">เกิน BOM {{ mrpNum(x.overBom) }}</span>
                    <span v-if="x.overRecv" class="tag bad" style="margin:1px 2px">เกินรับเข้า {{ mrpNum(x.overRecv) }}</span>
                    <span v-if="x.dupOf" class="tag warn" style="margin:1px 2px">ซ้ำกับรายการ {{ localDate(x.dupOf.at) }} · {{ mrpNum(x.dupOf.qty) }}</span>
                    <span v-if="!x.overBom && !x.overRecv && !x.dupOf" class="hint">—</span></td></tr>
                <tr v-if="!bpFixRows.length"><td colspan="7" class="hint">ไม่มีรายการจ่ายของ PO นี้ที่ยังไม่ถูกยกเลิก</td></tr>
              </tbody></table>
            <template v-if="bpFixSrc">
              <p style="margin:14px 0 4px"><b>2. รายการนี้ควรจ่ายเท่าไหร่</b>
                <span class="hint"> — ใส่ 0 ถ้ารายการนี้ไม่ควรมีเลย (คีย์ซ้ำ / ผิด PO)</span></p>
              <div class="row">
                <label class="f" style="width:170px">จำนวนที่ถูกต้อง
                  <input v-model.number="bpFix.qty" type="number" step="any" min="0" class="mono" data-bpfix-qty></label>
                <button v-if="bpFixChk && bpFixChk.suggest !== null" class="btn" style="align-self:flex-end" data-bpfix-suggest
                        @click="bpFix.qty = bpFixChk.suggest">ใช้ {{ mrpNum(bpFixChk.suggest) }} (หายเกิน)</button>
              </div>
              <div class="msg bad" v-if="bpFixChk && bpFixChk.bigger" style="margin:10px 0 0">
                แก้ได้แค่ลดลง — ใส่น้อยกว่า {{ mrpNum(bpFixChk.old) }} · ถ้าต้องจ่ายเพิ่มให้ใช้ปุ่ม "จ่าย"</div>
              <div class="msg bad" v-else-if="bpFixChk && bpFixChk.qty !== null && bpFixChk.qty < 0" style="margin:10px 0 0">จำนวนติดลบไม่ได้</div>
              <div class="msg" v-else-if="bpFixChk && bpFixChk.ok" style="margin:10px 0 0"
                   :class="bpFixChk.afterDiff > 0 || bpFixChk.balAfter < 0 ? 'warn' : 'ok'">
                หลังแก้: จ่ายรวม {{ mrpNum(bpFixRow.issued) }} − {{ mrpNum(bpFixChk.old) }} + {{ mrpNum(bpFixChk.qty) }} = <b>{{ mrpNum(bpFixChk.after) }}</b>
                <template v-if="bpFixChk.afterDiff === null"> · ไม่รู้ยอดตาม BOM</template>
                <template v-else> · ตาม BOM {{ mrpNum(bpFixRow.need) }} →
                  <b>{{ bpFixChk.afterDiff > 0 ? 'ยังเกิน ' + mrpNum(bpFixChk.afterDiff) + ' — มีรายการอื่นต้องแก้อีก'
                        : bpFixChk.afterDiff === 0 ? 'พอดี BOM' : 'ยังจ่ายได้อีก ' + mrpNum(-bpFixChk.afterDiff) }}</b></template>
                <br>คงเหลือ PO นี้ {{ mrpNum(bpFixRow.bal) }} + {{ mrpNum(bpFixChk.old - bpFixChk.qty) }} = <b>{{ mrpNum(bpFixChk.balAfter) }}</b>
                <b v-if="bpFixChk.balAfter < 0"> → ยังจ่ายเกินรับเข้า {{ mrpNum(-bpFixChk.balAfter) }} — มีรายการอื่นต้องแก้อีก</b></div>
              <div class="row" style="margin-top:12px">
                <label class="f grow">เหตุผลที่แก้<input v-model="bpFix.reason" data-bpfix-why></label>
                <label class="f" style="width:180px">ชื่อผู้แก้<input v-model.trim="bpFix.by"></label>
              </div>
              <p class="hint" v-if="bpFix.reason && bpFixWhy" style="color:var(--bad);margin:6px 0 0">{{ bpFixWhy }}</p>
              <p class="hint" style="margin:8px 0 0">รายการเดิมจะถูกยกเลิก (ยังอยู่ใน Log แบบขีดฆ่า) แล้วบันทึกจำนวนใหม่แทน
                วันที่ · ผู้จ่าย · หมายเหตุ เหมือนเดิม</p>
            </template>
          </template>
          <div class="row" style="margin-top:12px">
            <div class="grow"></div>
            <button class="btn" @click="bpFix.open=false">ไม่แก้แล้ว</button>
            <button class="btn primary" @click="bpFixSave"
                    :disabled="!bpFixChk || !bpFixChk.ok || !bpFix.by || !!bpFixWhy">บันทึกการแก้</button>
          </div>
        </div>
      </div>
      <!-- ล้างเศษ (เจ้าของสั่ง 27 พ.ย. 2026) — กดป้าย "เศษ" บนแถว PO หรือปุ่มในรายการเคลื่อนไหว · กรอกวันที่ · ชื่อ แบบกล่องจ่ายออก
           โชว์ รับเข้า / จ่ายออก / คงเหลือ ให้เห็นว่าเศษมาจากไหน -->
      <div class="modal" v-if="bpFq.open" @click.self="bpFq.open=false">
        <div class="modal-box" style="width:min(520px,100%)" role="dialog" aria-modal="true">
          <h2>ล้างเศษ</h2>
          <table><tbody>
            <tr><td class="hint" style="width:150px">P/N</td><td class="mono">{{ bpFq.pn || 'ไม่รู้ P/N' }}</td></tr>
            <tr><td class="hint">PO</td><td class="mono"><b>{{ bpFq.po }}</b></td></tr>
            <tr><td class="hint">วัตถุดิบ</td><td><span class="mono">{{ bpFq.code }}</span> {{ (matOf(bpFq.code) || {}).description || '' }}</td></tr>
            <template v-if="bpFqRow">
              <tr><td class="hint">รับเข้า PO นี้</td><td class="mono">{{ mrpNum(bpFqRow.recv) }}
                <span v-if="bpFqRow.sendback" class="bp-sb" style="display:inline;margin-left:6px">ส่งคืน Delta {{ mrpNum(bpFqRow.sendback) }}</span></td></tr>
              <tr><td class="hint">จ่ายออก</td><td class="mono">{{ mrpNum(bpFqRow.issued) }}</td></tr>
              <tr><td class="hint"><b>คงเหลือ (เศษ)</b></td><td class="mono"><b>{{ mrpNum(bpFqRow.bal) }}</b> {{ unitOf(bpFq.code) }}
                <span class="hint">ต่ำกว่าเกณฑ์ {{ fracTolAt(bpFq.code) }}</span></td></tr>
            </template>
          </tbody></table>
          <p v-if="!bpFqRow || !bpFrac(bpFqRow, bpFq.code)" class="msg bad" style="margin:10px 0 0">PO นี้ไม่มีเศษให้ล้างแล้ว (อาจล้างจากเครื่องอื่นแล้ว) — ปิดกล่องได้เลย</p>
          <p v-else class="hint" style="margin:10px 0 0">บันทึกเป็นรายการปรับยอด "ล้างเศษ" แยก คงเหลือ PO นี้จะเป็น 0 · ยอดที่จ่ายไปไม่เปลี่ยน</p>
          <div class="row" style="margin-top:12px">
            <!-- :min = วันที่จ่ายออกครั้งล่าสุด · ล้างเศษก่อนใบจ่ายทำให้ยกเลิกใบจ่ายแล้วยอด PO ขาดไปเท่าเศษ (ผู้ตรวจ #198)
                 เป็นแค่ความสะดวก ด่านจริงอยู่ที่ bpFracClean เพราะ min กันการพิมพ์ค่าเองไม่ได้ -->
            <label class="f" style="width:150px">วันที่<input v-model="bpFq.date" type="date" :min="localDate(bpFqFloor)" :max="todayLocal()"></label>
            <label class="f grow">ชื่อผู้ล้าง<input v-model.trim="bpFq.person" data-bpfq-person></label>
          </div>
          <div class="row" style="margin-top:12px">
            <div class="grow"></div>
            <button class="btn" @click="bpFq.open=false">ไม่ล้างแล้ว</button>
            <button class="btn primary" @click="bpFracClean"
                    :disabled="!bpFqRow || !bpFrac(bpFqRow, bpFq.code) || !bpFq.person || !bpFq.date">บันทึกล้างเศษ</button>
          </div>
        </div>
      </div>

      <!-- ════════ คืนของ (over รอคืน · เจ้าของสั่ง 27 พ.ย. 2026) ════════
           ไม่มีคำอธิบายล่วงหน้า · ปัญหาขึ้นเป็นข้อความแดงตอนเกิดจริง และปุ่มบันทึกกดไม่ได้ (rtProblem ใน app.js)
           แบบ 3 PC return ตามมาใบถัดไป (ต้องอ่านหมายเหตุคอลัมน์ L ของไฟล์ PO รายวันก่อน) -->
      <div class="modal" v-if="rt.row" @click.self="rt.row=null">
        <div class="modal-box rt-pop" style="width:min(920px,100%)">
          <div class="row" style="align-items:flex-start">
            <div class="grow">
              <h2 style="margin:0;font-size:22px">คืนของ · <span class="mono">{{ rt.row.code }}</span> {{ mrpName(rt.row.code) }}</h2>
              <div class="hint">over ของ PO <b class="mono">{{ rt.row.po }}</b> · P/N {{ rt.row.part_no || '—' }} ·
                ตั้งเรื่อง <span class="mono">{{ rt.row.date || '—' }}</span><template v-if="rt.row.created_by"> · {{ rt.row.created_by }}</template></div>
            </div>
            <button class="btn-q" style="font-size:20px" aria-label="ปิด" @click="rt.row=null">✕</button>
          </div>
          <!-- หลักฐาน: ตั้งไว้ − คืนแล้ว = ยังค้าง + คงคลังตอนนี้ -->
          <div class="rt-ev">
            <div><span class="hint">ยอดที่ตั้งเรื่อง</span><b class="mono">{{ mrpNum(rt.row.qty) }}</b></div>
            <div><span class="hint">ยอดที่คืนแล้ว</span><b class="mono">{{ mrpNum(Number(rt.row.done_qty) || 0) }}</b></div>
            <div class="key"><span class="hint">ยอดที่ยังค้าง (คืนได้ไม่เกินนี้)</span><b class="mono">{{ mrpNum(rtRemain) }} <span class="hint">{{ rt.row.unit }}</span></b></div>
            <div><span class="hint">คงคลังตอนนี้ (ทุก PO)</span><b class="mono">{{ mrpNum(rtBook) }}</b></div>
          </div>
          <div class="mrp-seg fol-seg rt-seg" role="group" aria-label="แบบการคืน">
            <button type="button" :aria-pressed="rt.mode === 1" @click="rt.mode = 1">1 · คืน Delta<small>ส่งของกลับไปให้ Delta</small></button>
            <button type="button" :aria-pressed="rt.mode === 2" @click="rt.mode = 2">2 · ทดแทน short ที่ค้าง<small>เอาไปชดเชยเรื่อง short ที่ตั้งไว้</small></button>
            <button type="button" :aria-pressed="rt.mode === 3" @click="rt.mode = 3">3 · PC return<small>PO ที่ไฟล์ PO แจ้ง PC / MC RETURN</small></button>
          </div>
          <div class="row" style="gap:14px;align-items:flex-end">
            <label class="f" style="width:200px">ผู้คืน<input v-model.trim="rt.person"></label>
            <label class="f" style="width:170px">วันที่คืน<input v-model="rt.date" type="date" :max="todayLocal()"></label>
            <label v-if="rt.mode === 1" class="f" style="width:170px">จำนวนที่คืน ({{ rt.row.unit }})
              <input v-model="rt.qty" type="number" step="any" class="mono" style="text-align:right"></label>
          </div>
          <div v-if="rt.mode === 1" class="row" style="gap:14px;margin-top:10px;align-items:flex-end">
            <label class="f" style="width:260px">เพราะอะไร
              <select v-model="rt.reason"><option v-for="x in rtReasons" :key="x.code" :value="x.code">{{ x.label }}</option></select></label>
            <label class="f grow" style="min-width:240px">หมายเหตุ<input v-model="rt.note"></label>
          </div>
          <template v-else>
            <table v-if="rtList.length" style="margin-top:10px">
              <thead><tr><th>PO</th><th>P/N</th><th>วันที่ตั้งเรื่อง</th><th class="r">ยอดที่ตั้งเรื่อง</th><th class="r">ยอดที่มาแล้ว</th>
                <th class="r">ยอด short ที่ยังค้าง</th><th v-if="rt.mode === 3">หมายเหตุในไฟล์ PO</th><th class="r">ยอดที่ทดแทนให้ PO นี้</th></tr></thead>
              <tbody><tr v-for="x in rtList" :key="x.id">
                <td class="mono">{{ x.po }}</td><td class="mono">{{ x.part_no || '—' }}</td>
                <td class="mono hint">{{ x.date || '—' }}<template v-if="x.created_by"> · {{ x.created_by }}</template></td>
                <td class="mono r">{{ x.qty > 0 ? mrpNum(x.qty) : '—' }}</td>
                <td class="mono r">{{ mrpNum(Number(x.done_qty) || 0) }}</td>
                <td class="mono r fol-key">{{ mrpNum(remainOf(x)) }}</td>
                <td v-if="rt.mode === 3" class="mono" style="font-size:13px">{{ rtPcOf(x).text }}
                  <div v-if="rtCap(x) < remainOf(x)" class="hint">ได้ไม่เกิน <b>{{ mrpNum(rtCap(x)) }}</b><template v-if="rtDone(x) > 0"> · ทดแทนไปแล้ว {{ mrpNum(rtDone(x)) }}</template></div></td>
                <td class="r"><input v-model="rt.pick[x.id]" type="number" step="any" min="0" class="mono fol-qty" style="text-align:right;margin:0"></td>
              </tr></tbody>
            </table>
            <div v-else-if="rt.mode === 3" class="msg warn">ไม่มีเรื่อง short ที่ยังค้างของรหัส <b class="mono">{{ rt.row.code }}</b> ที่ไฟล์ PO แจ้ง PC / MC RETURN</div>
            <div v-else class="msg warn">ไม่มีเรื่อง short ที่ยังค้างของรหัส <b class="mono">{{ rt.row.code }}</b> ในนิติบุคคลนี้</div>
            <div v-if="rt.mode === 2 && rtShorts.length > rtList.length" class="hint" style="margin-top:6px">
              อีก {{ rtShorts.length - rtList.length }} PO ไฟล์ PO แจ้ง PC / MC RETURN — อยู่ในแบบ 3</div>
          </template>
          <div class="msg bad" v-if="rtProblem"><b>{{ rtProblem }}</b></div>
          <div class="msg ok" v-else-if="rtQty > 0">
            <template v-if="rt.mode === 1">คืน <b>{{ mrpNum(rtQty) }}</b> ให้ Delta → over ของ {{ rt.row.po }} เหลือค้าง <b>{{ mrpNum(rtRemain - rtQty) }}</b>
              · คงคลัง {{ mrpNum(rtBook) }} → <b>{{ mrpNum(rtBook - rtQty) }}</b></template>
            <template v-else>รวม{{ rt.mode === 3 ? ' PC return' : 'ทดแทน' }} <b>{{ mrpNum(rtQty) }}</b> → over ของ {{ rt.row.po }} เหลือค้าง <b>{{ mrpNum(rtRemain - rtQty) }}</b>
              · คงคลังเท่าเดิม <b>{{ mrpNum(rtBook) }}</b></template>
          </div>
          <div class="msg warn" v-if="rtWarn" style="white-space:pre-line">{{ rtWarn }}</div>
          <div class="row" style="margin-top:14px">
            <div class="grow"></div>
            <button class="btn" @click="rt.row=null">ปิด</button>
            <button class="btn primary" :disabled="!rtReady" @click="saveReturnPop">{{ rt.busy ? 'กำลังบันทึก...' : 'บันทึกการคืน' }}</button>
          </div>
        </div>
      </div>

      <!-- ════════ ค้นเลข PO (หน้ารับเข้า · หน้าจ่ายออก) ════════ -->
      <div class="modal" v-if="poPick" @click.self="poPick=''">
        <div class="modal-box">
          <div class="row">
            <input v-model.trim="poPickQ" class="grow mono" ref="poPickInput"
                   placeholder="พิมพ์บางส่วนของเลข PO เช่น 4 ตัวท้าย">
            <button class="btn" @click="poPick=''">ปิด</button>
          </div>
          <div class="scroll" style="margin-top:10px;max-height:52vh">
            <table>
              <thead><tr><th style="width:160px">เลข PO</th><th style="width:130px">P/N</th>
                <th style="width:110px">วันที่</th><th style="width:170px">ที่มา</th><th>สถานะ</th></tr></thead>
              <tbody><tr v-for="r in poPickResults" :key="r.po"
                         style="cursor:pointer" @click="choosePo(r)">
                <td class="mono"><b>{{ r.po }}</b></td>
                <td class="mono">{{ r.pn }}</td>
                <td class="mono">{{ r.date }}</td>
                <td><span v-for="f in r.from" :key="f" class="tag">{{ f }}</span></td>
                <td><span v-for="f in r.status" :key="f" class="tag">{{ f }}</span></td>
              </tr></tbody>
            </table>
            <p v-if="!poPickResults.length" class="empty">
              ไม่เจอเลข PO ที่ตรง — พิมพ์เลขเต็มลงในช่องได้เลย</p>
          </div>
        </div>
      </div>

      <!-- ════════ ค้นหารหัส (ใช้ร่วมกันทุกหน้า) ════════ -->
      <div class="modal" v-if="pick" @click.self="pick=null">
        <div class="modal-box">
          <div class="row">
            <input v-model.trim="pickQ" class="grow" placeholder="พิมพ์รหัสหรือชื่อ" ref="pickInput">
            <button class="btn" @click="pick=null">ปิด</button>
          </div>
          <div class="scroll" style="margin-top:10px;max-height:52vh">
            <table>
              <thead><tr><th style="width:120px">รหัส</th><th>ชื่อ</th>
                <th style="width:60px">หน่วย</th><th style="width:110px">หมวด</th></tr></thead>
              <tbody><tr v-for="m in pickResults" :key="m.material_code"
                         style="cursor:pointer" @click="choosePick(m)">
                <td class="mono"><b>{{ m.material_code }}</b></td>
                <td>{{ m.description }}
                  <span v-if="m.dupDesc" class="tag warn">ชื่อซ้ำ — ดูรหัส</span></td>
                <td class="mono">{{ m.unit }}</td>
                <td><span class="tag">{{ m.category }}</span></td>
              </tr></tbody>
            </table>
            <p v-if="!pickResults.length" class="empty">ไม่เจอ — พิมพ์รหัสลงช่องแล้วกด "เพิ่มเลย" ได้</p>
          </div>
        </div>
      </div>
    </main>

    <div class="toast" :class="{bad:toast.bad}" v-if="toast.show">{{ toast.text }}</div>
    <!-- มาจากป้าย "จบเรื่องแล้ว" ในแท็บ MRP — กดกลับไปใบเดิม แถวเดิม -->
    <button v-if="mrpBack && (tab === 'fshort' || tab === 'fover')" class="btn primary mrp-back" @click="mrpGoBack">
      ‹ กลับไป MRP · {{ mrpBack.po }}</button>
  </template>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
