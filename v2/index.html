<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="app-version" content="2026-11-28.12">
<title>ระบบ Bin Card v2</title>

<!--
  ⚠️ ไลบรารีทั้งหมดอยู่ในเครื่อง ห้ามเปลี่ยนไปโหลดจากเน็ต
  v1 โหลดจาก cdnjs ทุกครั้งที่เปิด เน็ตโรงงานบล็อกเมื่อไหร่ก็หน้าขาวสนิท
  ทั้งที่ข้อมูลอยู่ในเครื่องครบและไม่ต้องใช้เน็ตทำงานเลย — ดู lib/README.md
-->
<script src="lib/vue.global.prod.js"></script>

<style>
:root{
  /* สีชุดเดียวกับ v1 โดยตั้งใจ — พนักงานจะใช้สองตัวคาบเกี่ยวกันช่วงเปลี่ยนผ่าน
     ถ้าหน้าตาต่างกันมากจะรู้สึกเหมือนต้องเรียนโปรแกรมใหม่ทั้งตัว */
  --bg:#f4f6f9;--panel:#fff;--line:#dde3ea;--ink:#1c2733;--muted:#68778a;
  --brand:#1f4e79;--soft:#e8f0f8;--ok:#1a7f4b;--okbg:#e6f5ed;
  --warn:#b06d00;--warnbg:#fff6e0;--bad:#c02626;--badbg:#fdecec;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Segoe UI","Sarabun","Noto Sans Thai",system-ui,sans-serif;font-size:14px}
#app{min-height:100vh;display:flex;flex-direction:column}
header{background:var(--brand);color:#fff;padding:9px 16px;display:flex;
  align-items:center;gap:14px;flex-wrap:wrap}
header h1{margin:0;font-size:15px;font-weight:600}
header .ver{font-size:11px;opacity:.75;padding:1px 7px;border:1px solid rgba(255,255,255,.4);
  border-radius:99px;font-variant-numeric:tabular-nums}
header .grow{flex:1}
header .who{font-size:12px;opacity:.9}
header .who-pick{font:inherit;font-size:13px;font-weight:600;padding:4px 8px;
  background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.35);
  border-radius:6px}
header .who-pick option{color:var(--ink)}
/* ป้ายสถานะซิงค์ — แบบเดียวกับ plan (เจ้าของขอ 6 ต.ค. 2026) */
header .sync-badge{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.3);color:#fff;padding:4px 12px;border-radius:99px;font:inherit;
  font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
header .sync-badge:hover{background:rgba(255,255,255,.24)}
header .sync-badge .dot{width:9px;height:9px;border-radius:50%;background:#9ca3af;flex-shrink:0}
header .sync-badge .dot.ok{background:#4ade80}
header .sync-badge .dot.busy,header .sync-badge .dot.pending{background:#fbbf24}
header .sync-badge .dot.error{background:#f87171}
.tabs{display:flex;gap:3px;flex-wrap:wrap}
.tabs button{background:rgba(255,255,255,.12);color:#fff;border:0;padding:7px 14px;
  border-radius:5px 5px 0 0;font:inherit;font-size:13px;cursor:pointer}
.tabs button.on{background:var(--bg);color:var(--brand);font-weight:600}
.subtabs{display:flex;gap:4px;flex-wrap:wrap;padding:8px 16px 0;background:var(--bg);
  border-bottom:1px solid var(--line)}
.subtabs button{background:transparent;border:1px solid transparent;border-bottom:0;
  padding:7px 13px;border-radius:6px 6px 0 0;font:inherit;font-size:13px;cursor:pointer;
  color:var(--muted)}
.subtabs button:hover{background:var(--panel)}
.subtabs button.on{background:var(--panel);border-color:var(--line);color:var(--brand);
  font-weight:600;margin-bottom:-1px;padding-bottom:8px}
@media print{.subtabs{display:none !important}}
main{padding:14px 16px 60px;flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:14px 16px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:14px;color:var(--brand)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
input,select{font:inherit;font-size:14px;padding:7px 9px;border:1px solid var(--line);
  border-radius:6px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--brand);outline-offset:-1px}
.btn{font:inherit;font-size:13px;padding:8px 15px;border:1px solid var(--line);
  border-radius:6px;background:#fff;cursor:pointer}
.btn:hover{background:#f0f4f8}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:600}
.btn.primary:hover{filter:brightness(1.12)}
.btn.danger{background:var(--bad);color:#fff;border-color:var(--bad);font-weight:600}
.btn.danger:hover{filter:brightness(1.12)}
.btn:disabled{opacity:.45;cursor:not-allowed}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#eef2f7;text-align:left;padding:7px 8px;border-bottom:2px solid var(--line);
  font-size:11px;color:var(--muted);white-space:nowrap;position:sticky;top:0}
td{padding:6px 8px;border-bottom:1px solid #f0f3f6;vertical-align:top}
tr.review td{background:#fffdf3}
/* แถวที่กดมาจากป้าย "จบเรื่องแล้ว" ในแท็บ MRP — กะพริบให้เห็นว่าคือแถวไหน */
tr.hit td{animation:hit 2.4s ease-out}
@keyframes hit{0%,40%{background:var(--warnbg);box-shadow:inset 0 0 0 9999px rgba(176,109,0,.08)}100%{background:transparent}}
button.tag.mrp-via{border:0;cursor:pointer;font-family:inherit}
button.tag.mrp-via:hover{text-decoration:underline}
.mrp-back{position:fixed;left:22px;bottom:22px;z-index:30;box-shadow:0 4px 14px rgba(18,32,44,.25)}
.mono{font-family:ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums}
.scroll{max-height:60vh;overflow:auto}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;
  background:var(--soft);color:var(--brand);white-space:nowrap}
.tag.ok{background:var(--okbg);color:var(--ok)}
.tag.warn{background:var(--warnbg);color:var(--warn)}
.bp-sb{color:var(--warn);font-size:12px;font-weight:600;white-space:nowrap}
.tag.bad{background:var(--badbg);color:var(--bad)}
/* MRP ราย PO — สีอยู่ที่ป้ายอย่างเดียว ไม่ระบายพื้นแถว (เจ้าของเคาะ 12 พ.ย. 2026) */
.mrp th,.mrp td{white-space:nowrap;vertical-align:middle}
.mrp .r{text-align:right}
/* ช่องสถานะตัดบรรทัดได้ — เหตุ "คิดไม่ได้" ยาว ไม่งั้นทั้งตารางกว้างจนมือถือย่อเหลือ 40% (อ่านไม่ออก) */
.mrp td.mrp-st{white-space:normal;min-width:160px}
/* ช่องสถานะห่างจาก PO Qty. (เจ้าของขอ 14 พ.ย. 2026) — เลื่อนเนื้อหาด้วย position:relative
   ไม่เปลี่ยนความกว้างคอลัมน์ คอลัมน์อื่นจึงไม่เลื่อนตาม (บทเรียนเดียวกับป้ายสถานะในตาราง BOM) */
.mrp .mrp-stin{position:relative;left:96px;width:calc(100% - 96px)}
@media (max-width:760px){.mrp .mrp-stin{left:24px;width:calc(100% - 24px)}}   /* มือถือช่องแคบ — เลื่อนน้อยลง ไม่ให้ตารางย่อเล็กกว่าเดิม */
/* จอคอม: ตาราง MRP ตัวใหญ่ขึ้นทั้งตาราง ให้อ่านง่าย (เจ้าของขอ 14 พ.ย. 2026 — ที่ว่างเหลือเยอะ)
   มือถือไม่ขยาย (ตารางย่อพอดีจออยู่แล้ว ขยายแล้วยิ่งเล็ก) */
@media (min-width:761px){
  table.mrp,table.mrp table.mrp-bom{font-size:15px}
  table.mrp th{font-size:13px}
  table.mrp td{padding-top:8px;padding-bottom:8px}
  table.mrp .tag{font-size:13px;padding:2px 10px}
  table.mrp .hint{font-size:14px}
}
.mrp-seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:10px;background:#eef2f7}
.mrp-seg button{border:0;background:transparent;font:inherit;font-size:13px;color:var(--muted);height:30px;padding:0 10px;
  border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.mrp-seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.mrp-dot{width:8px;height:8px;border-radius:50%;background:#c5ced8}
.mrp-dot.ok{background:var(--ok)} .mrp-dot.bad{background:var(--bad)} .mrp-dot.warn{background:#d99a1e}
tr.mrp-po{cursor:pointer} tr.mrp-po:hover td{background:var(--soft)}
/* ตารางจ่ายออก: ตั้งแต่คอลัมน์หน่วยไปจัดกลาง (เจ้าของสั่ง 22 พ.ย. 2026) */
table.out-tbl th:nth-child(n+3),table.out-tbl td:nth-child(n+3){text-align:center}
table.out-tbl td:nth-child(n+3) .row{justify-content:center}
.mrp-in{padding:8px 12px 16px 30px;white-space:normal}   /* ข้อความในช่องกาง (เช่น "PO ที่นับ" หลายใบ) ขึ้นบรรทัดใหม่ได้ — ไม่งั้นดันตารางล้นขวา · ช่องตารางข้างในยัง nowrap ตาม .mrp td */
.mrp-bom{margin-top:8px;border:1px solid var(--line);background:var(--panel)}
/* PO ที่กางอยู่ — แถบซ้ายสีหลัก + พื้นอ่อน + เส้นปิดท้าย ให้แยกจากแถวอื่นชัด (เจ้าของขอ 13 พ.ย. 2026)
   เป็นสีของ "กำลังกาง" ไม่ใช่สีสถานะ — สถานะยังอยู่ที่ป้ายอย่างเดียว */
tr.mrp-po.open > td{background:var(--soft);border-top:2px solid var(--brand)}
tr.mrp-po.open > td:first-child{box-shadow:inset 4px 0 0 var(--brand)}
tr.mrp-po.open > td:last-child{box-shadow:inset -2px 0 0 var(--brand)}
tr.mrp-det > td{box-shadow:inset 4px 0 0 var(--brand),inset -2px 0 0 var(--brand)}
tr.mrp-po.open .mrp-pono{font-weight:700;color:var(--brand)}
/* WK ที่เดาจากล็อตรับเข้า (plan ไม่มี) — สีจาง ให้รู้ว่าไม่ใช่ของ plan · ชี้เมาส์บอกที่มา */
.mrp td.mrp-wklot{color:var(--muted)}
.mrp .mrp-wkin{width:66px;padding:2px 6px;font:inherit}
/* ใบที่กาง: WK · วันที่ · PO · P/N · PO Qty. ตัวใหญ่ตัวหนา ให้ผู้สูงอายุอ่านง่าย (เจ้าของขอ 13 พ.ย. 2026) */
tr.mrp-po.open > td.mono{font-size:19px;font-weight:700;padding-top:10px;padding-bottom:10px}
/* จอคอม: หัวใบที่กาง 22px — ⚠️ ต้องอยู่หลังกฎ 19px ข้างบน: selector เดียวกัน @media ไม่เพิ่ม specificity
   ตัวที่อยู่ล่างกว่าชนะ (ผู้ตรวจ #158 รอบ 1 ข้อ 1 — เดิมวางไว้ข้างบนแล้วไม่มีผล) */
@media (min-width:761px){tr.mrp-po.open > td.mono{font-size:22px}}
tr.mrp-det > td{background:var(--soft);border-bottom:2px solid var(--brand)}
/* เว้นที่ว่างบน-ล่างของใบที่กาง ให้ลอยแยกจากใบข้าง ๆ ไม่ใช่แค่ตีกรอบ (เจ้าของขอ 13 พ.ย. 2026) */
tr.mrp-space > td{height:28px;padding:0;border:0;background:transparent}
/* ป้ายสถานะห่างจากตัวเลข "รับแล้ว" (เจ้าของขอ 13 พ.ย. 2026)
   ⚠️ เลื่อนด้วย position:relative เท่านั้น — ไม่เปลี่ยนความกว้างคอลัมน์ คอลัมน์อื่นจึงอยู่ที่เดิม
      เพิ่ม padding / width ที่ช่องนี้แล้วตาราง (auto layout) แบ่งที่ใหม่ ทุกคอลัมน์เลื่อนตาม — เจ้าของทักแล้ว */
.mrp-bom .mrp-gap{padding-left:32px}
.mrp-bom .mrp-gap > span,.mrp-bom .mrp-gap > button{position:relative;left:30%}
.tag.mute{background:#eceff3;color:#5b6878}
/* ยอดคงคลังราย P/N: ยอดติดลบราย PO กดได้ → แท็บ Log จ่ายออก */
button.tag.bp-frac{border:1px solid currentColor;cursor:pointer;font-family:inherit}
button.tag.bp-frac:hover{text-decoration:underline}
.bp-lnk{font:inherit;font-weight:700;color:var(--bad);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
/* หน้า short / over จัดกลุ่มราย PO (เจ้าของสั่ง 21 พ.ย. 2026) — สีและแถบซ้ายแบบแท็บ MRP
   ตัวใหญ่ทั้งหน้า + หัวคอลัมน์อยู่ใต้หัว PO ทุกใบ ให้ผู้สูงอายุอ่านง่าย (เจ้าของขอ 21 พ.ย. 2026) */
.fol-bar{gap:10px 14px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);align-items:flex-end}
.fol-bar label.f{font-size:14px}
.fol-add{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:8px;background:#f8fafc}
/* ปุ่มกรองตัวใหญ่ เต็มแถว ปุ่มที่เลือกเป็นสีน้ำเงินทึบ (เจ้าของขอ 21 พ.ย. 2026 — แบบ MRP เล็กเกินไปสำหรับผู้สูงอายุ) */
.fol-seg{display:flex;flex:1 1 100%;gap:8px;padding:6px;border-radius:12px}
.fol-seg button{flex:1 1 0;justify-content:center;height:56px;padding:0 16px;font-size:18px;font-weight:600;color:var(--ink);
  background:#fff;box-shadow:0 0 0 1px var(--line);border-radius:8px;gap:10px}
.fol-seg button:hover{box-shadow:0 0 0 2px var(--brand)}
.fol-seg button:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.fol-seg button[aria-pressed="true"]{background:var(--brand);color:#fff;box-shadow:none}
.fol-seg .mrp-dot{width:12px;height:12px}
.fol-seg button[aria-pressed="true"] .mrp-dot{box-shadow:0 0 0 2px #fff}
.fol-seg .hint{font-size:18px;font-weight:700;color:inherit;opacity:.8}
table.fol{table-layout:fixed;width:100%;font-size:16px}
table.fol td{vertical-align:middle;padding-top:10px;padding-bottom:10px}
table.fol .hint{font-size:14px}
table.fol .tag{font-size:13px;padding:2px 10px}
.fol .r{text-align:right}
.fol .mono{font-variant-numeric:tabular-nums}
tr.fol-th > th{position:static;background:#fff;font-size:14px;font-weight:600;color:#3d4b5c;padding:8px 8px 6px;
  border-bottom:2px solid var(--line);white-space:normal}
tr.fol-th > th.r{text-align:right}
tr.fol-po{cursor:pointer}
tr.fol-po > td{background:var(--soft);border-top:20px solid var(--panel);padding-top:10px;padding-bottom:10px}
tbody:first-of-type > tr.fol-po > td{border-top:0}
tr.fol-po:hover > td{background:#dde8f3}
tr.fol-po > td:first-child,tr.fol-th > th:first-child,tr.fol-it > td:first-child{box-shadow:inset 4px 0 0 var(--brand)}
tbody.shut tr.fol-po > td:first-child{box-shadow:inset 4px 0 0 #c5ced8}
.fol-head{display:flex;gap:20px;align-items:baseline;flex-wrap:wrap}
.fol-head b{font-size:19px;color:var(--brand)}
.fol-head .hint{font-size:15px}
.fol-n{margin-left:auto}
.fol-key{font-weight:600;font-size:17px}
.fol-act{white-space:normal}
.fol-act .btn{font-size:15px;padding:6px 16px}
.fol-got{display:inline-block;min-width:120px;text-align:right;margin-right:16px}
.card h2.fol-title{margin:4px 0 6px;font-size:32px;text-align:center}
.card p.fol-sub{margin:0 0 14px;font-size:16px;text-align:center}
table.fol.even td.fol-act,table.fol.even tr.fol-th th:last-child{padding-left:56px}
/* หน้าต่าง คืนของ (เจ้าของสั่ง 27 พ.ย. 2026) — กล่องหลักฐานบนสุด + ปุ่มเลือกแบบตัวใหญ่ */
.rt-ev{display:flex;gap:10px;margin:14px 0 4px}
.rt-ev > div{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:#fafbfd}
.rt-ev b{display:block;font-size:22px}
.rt-ev .key{background:var(--warnbg);border-color:#f0d799}
.rt-seg{margin:14px 0}
.rt-seg button{flex-direction:column;height:64px;gap:2px}
.rt-seg button small{font-size:12.5px;font-weight:400;opacity:.8}
.rt-pop .msg{font-size:15px;margin:10px 0 0}
.fol-qty{width:96px;padding:6px 8px;margin-right:4px;font-size:15px}
.btn-q{font:inherit;font-size:14px;background:none;border:0;color:var(--muted);padding:6px 8px;cursor:pointer;border-radius:6px}
.btn-q:hover:not(:disabled){color:var(--ink);background:var(--soft)}
.btn-q:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.btn-q:disabled{opacity:.5;cursor:default}
.fol-help{margin-top:16px;font-size:14px;color:var(--muted)}
.fol-help summary{cursor:pointer;color:var(--brand);font-size:15px}
.fol-help p{margin:8px 0 0;line-height:1.7}
.msg{padding:9px 12px;border-radius:6px;margin-bottom:10px;font-size:13px}
.msg.ok{background:var(--okbg);color:var(--ok);border:1px solid #b9e2cb}
.msg.warn{background:var(--warnbg);color:var(--warn);border:1px solid #f0d799}
.msg.bad{background:var(--badbg);color:var(--bad);border:1px solid #f0c4c4}
.hint{font-size:12px;color:var(--muted)}
.drop{border:2px dashed var(--line);border-radius:10px;padding:30px;text-align:center;transition:.15s}
.drop.over{border-color:var(--brand);background:var(--soft)}
.big{font-size:28px;font-weight:700;color:var(--brand);line-height:1.15;
  font-variant-numeric:tabular-nums}
.big.bad{color:var(--bad)} .big.warn{color:var(--warn)}
textarea{font:inherit}
.printonly{display:none}
.fold-btn{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left}
.fold-btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:3px}
.fold-i{display:inline-block;width:1.1em}
.fold-shut{display:none}
.modal{position:fixed;inset:0;background:rgba(18,32,44,.45);display:flex;
  align-items:flex-start;justify-content:center;padding:60px 16px;z-index:40}
.modal-box{background:var(--panel);border-radius:10px;padding:16px;width:min(760px,100%);
  box-shadow:0 12px 40px rgba(0,0,0,.3)}
.modal-box tbody tr:hover{background:var(--soft)}
.notice-body{max-height:55vh;overflow:auto;padding:4px 12px 8px 2px;line-height:1.6}
.notice-body h3{margin:14px 0 4px;font-size:15px} .notice-body p{margin:2px 0 6px}

/* ── ใบนับตอนพิมพ์ ──
   ช่อง "นับได้" ต้องเป็นกรอบว่างให้เขียนด้วยมือ ไม่ใช่ช่องกรอกบนจอที่พิมพ์ออกมาว่าง ๆ
   และห้ามมียอดของระบบโผล่มาในใบนับเด็ดขาด — ดูเหตุผลใน core/count.js */
@media print{
  header,.noprint,.tabs{display:none !important}
  body{background:#fff}
  main{padding:0}
  .card{border:0;padding:0;margin:0}
  .fold-shut{display:revert}
  .fold-i{display:none}
  .printonly{display:flex;justify-content:space-between;align-items:baseline;
    margin-bottom:10px;font-size:13px}
  .scroll{max-height:none;overflow:visible}
  table{font-size:12px}
  th{background:#fff;border-bottom:1.5px solid #000;position:static}
  td{border-bottom:1px solid #ccc;padding:7px 8px}
  .countcell{border:1px solid #000;min-width:90px}
  tr{page-break-inside:avoid}
}
.empty{padding:26px;text-align:center;color:var(--muted)}
.boot{padding:60px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);
  color:#fff;padding:10px 20px;border-radius:8px;font-size:14px;z-index:50;
  box-shadow:0 6px 22px rgba(0,0,0,.28)}
.toast.bad{background:var(--bad)}
</style>
</head>
<body>
<div id="app">
  <div class="boot" v-if="!ready">{{ bootMsg }}</div>

  <template v-else>
    <header>
      <h1>ระบบ Bin Card</h1>
      <span class="ver" style="cursor:pointer" @click="checkUpdate(false)"
            title="กดเพื่อตรวจว่ามีเวอร์ชันใหม่ไหม">v{{ APP_VERSION }}</span>
      <!-- เครื่องที่ cache ไฟล์เก่าค้างไว้ทำให้แจ้งบั๊กซ้ำเรื่องที่แก้ไปแล้ว
           โดยไม่มีใครรู้ว่ากำลังคุยกันคนละเวอร์ชัน -->
      <button v-if="newVersion" class="btn" :disabled="verBusy" @click="reloadApp"
              title="เครื่องนี้ยังใช้ไฟล์เก่าอยู่ กดเพื่อโหลดเวอร์ชันล่าสุด"
              style="background:var(--warn,#a15c00);color:#fff;border-color:transparent;margin-left:10px">
        {{ verBusy ? 'กำลังโหลด...' : 'มีเวอร์ชันใหม่ ' + newVersion + ' — โหลดใหม่' }}
      </button>
      <div class="tabs">
        <button v-for="g in GROUPS" :key="g.k"
                :class="{on: openGroup===g.k}" @click="openGroup=g.k">{{ g.label }}</button>
      </div>
      <div class="grow"></div>
      <button class="sync-badge" :title="badge.title" @click="onBadge">
        <span class="dot" :class="badge.cls"></span><span>{{ badge.text }}</span></button>
      <!-- เปลี่ยนตัวนี้ = เปลี่ยนความหมายของทุกยอดบนหน้าจอ ไม่ใช่แค่การกรอง -->
      <select class="who-pick" :value="entity" @change="switchEntity($event.target.value)"
              title="นิติบุคคล — ยอดคงคลังของแต่ละโรงงานแยกกัน">
        <option v-for="c in entCodes" :key="c" :value="c">{{ c }}</option>
      </select>
    </header>

    <div class="subtabs">
      <button v-for="t in (GROUPS.find(g => g.k===openGroup) || {}).tabs" :key="t.k"
              :class="{on: tab===t.k}" @click="tab=t.k">
        {{ t.label }}<span v-if="t.k==='mat' && needReview" class="tag warn"
                           style="margin-left:5px">{{ needReview }}</span>
      </button>
    </div>

    <main>
      <div class="msg bad" v-if="bootError">{{ bootError }}</div>

      <!-- ⚠️ ปิดไม่ได้โดยตั้งใจ — เครื่องอื่นบันทึกชนิดรายการที่โปรแกรมรุ่นนี้ยังไม่รู้จัก
           ยอดทุกหน้าในเครื่องนี้จึงไม่ตรงกับเครื่องอื่น แถบนี้หายเองเมื่อโหลดโปรแกรมรุ่นใหม่แล้ว (ดู unknownKinds) -->
      <div class="msg bad" v-if="strangeKinds.length">
        <b>เครื่องนี้ยังใช้โปรแกรมรุ่นเก่า — ยอดคงเหลือจะไม่ตรงกับเครื่องอื่น</b><br>
        มีรายการที่โปรแกรมรุ่นนี้ยังไม่รู้จัก ({{ strangeKinds.map(k => '"' + k.kind + '" ' + k.n + ' รายการ').join(' · ') }})
        จึงไม่ถูกนับเข้ายอด — กดโหลดโปรแกรมใหม่ · ถ้าโหลดแล้วยังขึ้นอยู่ให้แจ้งผู้ดูแล · ห้ามส่ง Bin Card ที่ออกจากเครื่องนี้ให้ลูกค้าจนกว่าแถบนี้จะหาย
        <div style="margin-top:8px">
          <button class="btn" :disabled="verBusy" @click="reloadApp">{{ verBusy ? 'กำลังโหลด...' : 'โหลดโปรแกรมใหม่' }}</button>
          <button class="btn" @click="tab='bal'">ดูรหัสที่ยอดไม่ตรง</button>
        </div>
      </div>

      <!-- ════════ หน้าแรก ════════ -->
      <template v-if="tab==='home'">
        <div class="card">
          <div class="row">
            <h2 style="margin:0">งานวันนี้ · {{ homeToday }}</h2>
            <div class="grow"></div>
            <button class="btn" style="margin-right:10px" @click="openNotice">มีอะไรใหม่</button>
            <span class="hint">นิติบุคคล {{ entity }}</span>
          </div>
          <p class="hint" style="margin:6px 0 12px">
            ไล่จากบนลงล่างได้เลย — ติ๊กเขียวแปลว่าทำแล้ว
          </p>
          <table>
            <tbody><tr v-for="t in homeTasks" :key="t.k">
              <td style="width:44px;text-align:center;font-size:17px">
                <span v-if="t.done === true" style="color:var(--ok)">✓</span>
                <span v-else-if="t.done === false" style="color:var(--warn)">•</span>
                <span v-else class="hint">—</span>
              </td>
              <td><b>{{ t.label }}</b><div class="hint">{{ t.detail }}</div></td>
              <td style="width:90px"><button class="btn" @click="tab=t.tab">ไปทำ</button></td>
            </tr></tbody>
          </table>
        </div>

        <div class="card" v-if="homeAlerts.length">
          <h2>ค้างอยู่</h2>
          <div class="row" style="gap:26px;margin-top:4px">
            <div v-for="a in homeAlerts" :key="a.label" style="cursor:pointer" @click="tab=a.tab">
              <div class="hint">{{ a.label }}</div>
              <div class="big" :class="a.bad ? 'bad' : 'warn'">{{ a.n }}</div>
            </div>
          </div>
        </div>

        <div class="card">
          <h2>วันนี้คีย์ไปแล้ว</h2>
          <div class="row" style="gap:28px;margin-top:4px">
            <div><div class="hint">รับเข้า</div><div class="big">{{ homeIn }}</div></div>
            <div><div class="hint">จ่ายออก</div><div class="big">{{ homeOut }}</div></div>
            <div><div class="hint">รหัสที่มีของอยู่</div><div class="big">{{ balSum.codes }}</div></div>
            <div v-if="balSum.negative"><div class="hint">ยอดติดลบ</div>
              <div class="big bad">{{ balSum.negative }}</div></div>
          </div>
          <p class="hint" style="margin:12px 0 0" v-if="!sync.url">
            ยังไม่ได้เชื่อมกับ Google Sheets — ข้อมูลอยู่แค่ในเครื่องนี้เครื่องเดียว
            <button class="btn" style="padding:2px 9px" @click="tab='sync'">ไปตั้งค่า</button>
          </p>
          <p class="hint" style="margin:12px 0 0" v-else-if="sync.lastOkAt">
            ซิงค์ล่าสุด {{ localDate(sync.lastOkAt) }} {{ localTime(sync.lastOkAt) }}
          </p>
        </div>
      </template>

      <!-- ════════ ทะเบียนวัตถุดิบ ════════ -->
      <template v-else-if="tab==='mat'">
        <div class="card">
          <div class="row">
            <label class="f grow" style="min-width:240px">ค้นหา
              <input v-model.trim="q" placeholder="พิมพ์รหัสหรือชื่อ เช่น 3220130200 หรือ TAPE PLE">
            </label>
            <label class="f">หมวด
              <select v-model="fCat">
                <option value="">ทุกหมวด</option>
                <option v-for="c in CATEGORIES" :key="c" :value="c">{{ c }}</option>
              </select>
            </label>
            <label class="f">แสดง
              <select v-model="fState">
                <option value="active">ที่ใช้งานอยู่</option>
                <option value="review">รอตรวจ</option>
                <option value="all">ทั้งหมด</option>
              </select>
            </label>
            <button class="btn primary" @click="startAdd">+ เพิ่มรหัสใหม่</button>
          </div>
          <p class="hint" style="margin:9px 0 0">
            ทะเบียนในเครื่อง <b>{{ materials.length.toLocaleString() }}</b> รายการ ·
            ใช้งานอยู่ {{ activeCount.toLocaleString() }}
            <span v-if="needReview"> · <span class="tag warn">รอคุณตรวจ {{ needReview }}</span></span>
          </p>
        </div>

        <!-- ── ฟอร์มเพิ่ม/แก้ ── -->
        <div class="card" v-if="edit">
          <h2>{{ edit._new ? 'เพิ่มรหัสใหม่' : 'แก้ไข ' + edit.material_code }}</h2>
          <div class="row">
            <label class="f" style="width:170px">รหัสวัตถุดิบ
              <input v-model.trim="edit.material_code" class="mono" :disabled="!edit._new"
                     placeholder="เช่น 3220130200">
            </label>
            <label class="f grow" style="min-width:260px">ชื่อ / คำอธิบาย
              <input v-model.trim="edit.description" placeholder="ชื่อที่พนักงานเรียกกันจริง">
            </label>
            <label class="f" style="width:90px">หน่วย
              <input v-model.trim="edit.unit" class="mono" placeholder="PCE">
            </label>
            <label class="f" style="width:140px">หมวด
              <select v-model="edit.category">
                <option v-for="c in CATEGORIES" :key="c" :value="c">{{ c }}</option>
              </select>
            </label>
          </div>
          <div class="row" style="margin-top:9px">
            <label class="row" style="gap:6px;font-size:13px">
              <input type="checkbox" v-model="edit.requires_expiry"> ต้องกรอกวันหมดอายุ</label>
            <label class="row" style="gap:6px;font-size:13px">
              <input type="checkbox" v-model="edit.active"> ใช้งานอยู่</label>
            <div class="grow"></div>
            <button class="btn" @click="edit=null">ยกเลิก</button>
            <button class="btn primary" @click="saveEdit" :disabled="codeCheck.level==='bad'">บันทึก</button>
          </div>

          <div class="msg bad" v-if="codeCheck.level==='bad'" style="margin:10px 0 0">
            {{ codeCheck.msg }}</div>
          <div class="msg warn" v-else-if="codeCheck.level==='warn'" style="margin:10px 0 0">
            ⚠️ {{ codeCheck.msg }}<br>
            <span class="hint">บันทึกต่อได้ ระบบจะทำเครื่องหมายไว้ให้เจ้าของตรวจอีกที</span></div>
          <div class="msg warn" v-if="edit._new && dupOf(edit.description).length" style="margin:10px 0 0">
            มีของชื่อนี้อยู่แล้ว {{ dupOf(edit.description).length }} รหัส —
            <span class="mono">{{ dupOf(edit.description).join(' · ') }}</span><br>
            <span class="hint">ถ้าเป็นของตัวเดียวกัน ใช้รหัสเดิมดีกว่า จะได้ไม่มีสองรายการที่แยกกันไม่ออก</span></div>
        </div>

        <!-- ── รายการ ── -->
        <div class="card">
          <div class="scroll">
            <table>
              <thead><tr>
                <th style="width:120px">รหัส</th><th>ชื่อ</th>
                <th style="width:70px">หน่วย</th><th style="width:110px">หมวด</th>
                <th style="width:90px">สถานะ</th><th style="width:120px"></th>
              </tr></thead>
              <tbody>
                <tr v-for="m in shown" :key="m.material_code" :class="{review:m.needs_review}">
                  <td class="mono"><b>{{ m.material_code }}</b></td>
                  <td>{{ m.description || '(ยังไม่มีชื่อ)' }}
                    <span v-if="m.dupDesc" class="tag warn" title="มีของชื่อเดียวกันหลายรหัส ดูที่รหัสให้ดี">ชื่อซ้ำ</span>
                  </td>
                  <td class="mono">{{ m.unit }}</td>
                  <td><span class="tag">{{ m.category }}</span></td>
                  <td>
                    <span v-if="m.needs_review" class="tag warn">รอตรวจ</span>
                    <span v-else-if="!m.active" class="tag bad">ปิดใช้งาน</span>
                    <span v-else class="tag ok">ใช้งานอยู่</span>
                  </td>
                  <td>
                    <button class="btn" style="padding:3px 9px" @click="startEdit(m)">แก้</button>
                    <button v-if="m.needs_review" class="btn" style="padding:3px 9px;margin-left:4px"
                            @click="approve(m)">ตรวจแล้ว</button>
                  </td>
                </tr>
              </tbody>
            </table>
            <p v-if="!shown.length" class="empty">
              ไม่เจอรายการที่ตรงกับที่ค้น<br>
              <span class="hint">ถ้าของอยู่ตรงหน้าแต่ไม่มีในทะเบียน กด "เพิ่มรหัสใหม่" ได้เลย</span>
            </p>
            <p v-else-if="shown.length>=SHOW_MAX" class="hint" style="padding:8px">
              แสดง {{ SHOW_MAX }} รายการแรก — พิมพ์ค้นให้แคบลงเพื่อดูตัวอื่น
            </p>
          </div>
        </div>
      </template>

      <!-- ════════ BOM ════════ -->
      <template v-else-if="tab==='bom'">
        <div class="card">
          <div class="drop" :class="{over:incDrag}"
               @dragover.prevent="incDrag=true" @dragleave="incDrag=false"
               @drop.prevent="onDropInc">
            <b style="font-size:16px">ลากไฟล์ใบเบิกวัตถุดิบมาวางตรงนี้</b>
            <p class="hint" style="margin:6px 0 0">
              ไฟล์ .xlsx ที่ออกใหม่ทุกสัปดาห์ (Rawmat Income wk__) — ชีตละหนึ่งใบ
              โปรแกรมจะเลือกใบล่าสุดของแต่ละ P/N ให้เอง</p>
            <p style="margin:12px 0 0">
              <input type="file" accept=".xlsx,.xls" @change="onPickInc" :disabled="incBusy"></p>
            <p v-if="incBusy" class="hint" style="margin:8px 0 0">กำลังอ่าน...</p>
          </div>
        </div>

        <!-- ── ผลการอ่านใบเบิก รอตรวจก่อนนำเข้า ── -->
        <template v-if="inc">
          <div class="card">
            <div class="row">
              <h2 style="margin:0">อ่านแล้ว — ตรวจก่อนนำเข้า</h2>
              <span class="tag mono">{{ inc.fileName }}</span>
              <div class="grow"></div>
              <button class="btn primary" @click="applyIncome" :disabled="incBusy || !incPicked.length">
                {{ incBusy ? 'กำลังนำเข้า...' : 'นำเข้า ' + incPicked.length + ' P/N' }}</button>
              <button class="btn" @click="inc=null">ยกเลิก</button>
            </div>

            <div class="row" style="gap:26px;align-items:flex-start;margin-top:12px">
              <div><div class="hint">จะนำเข้า</div>
                <div class="big">{{ incPickedLines.toLocaleString() }}</div>
                <div class="hint">บรรทัด จาก {{ incPicked.length }} P/N</div></div>
              <div><div class="hint">ใบในไฟล์</div>
                <div class="big">{{ inc.sum.sheets }}</div>
                <div class="hint">ทิ้งใบเก่าไป {{ inc.sum.dropped }}</div></div>
              <div v-if="inc.sum.conflicts"><div class="hint">ใบของ P/N เดียวกันค่าไม่ตรง</div>
                <div class="big bad">{{ inc.sum.conflicts }}</div><div class="hint">บรรทัด</div></div>
              <div v-if="inc.sum.outliers"><div class="hint">หลุดค่ากลางของรหัสนั้น</div>
                <div class="big warn">{{ inc.sum.outliers }}</div><div class="hint">บรรทัด</div></div>
            </div>
            <p class="hint" style="margin:10px 0 0">
              ใบในไฟล์ลงวันที่ {{ inc.sum.from }} ถึง {{ inc.sum.to }} ·
              หัวกระดาษเป็น
              <span v-for="(n,c) in inc.sum.companies" :key="c" class="mono">{{ c }} {{ n }}&nbsp;</span>
            </p>

            <div class="msg bad" v-if="inc.sum.failed.length" style="margin:12px 0 0">
              <b>ใบที่อ่านไม่ได้ {{ inc.sum.failed.length }} ใบ — ต้องแก้ที่ไฟล์ต้นทาง</b>
              <div v-for="f in inc.sum.failed" :key="f.sheet" class="hint">
                ชีต <b class="mono">{{ f.sheet }}</b> — {{ f.error }}</div>
            </div>

            <div class="msg bad" v-if="inc.sum.badUnits.length" style="margin:10px 0 0">
              <b>⚠️ บรรทัดที่ไม่ให้เข้าเพราะหน่วยไม่รู้จัก</b>
              <table style="margin:8px 0 0;max-width:620px;background:#fff">
                <thead><tr><th style="width:90px">หน่วยในใบ</th><th style="width:80px">บรรทัด</th><th>ตัวอย่าง</th></tr></thead>
                <tbody><tr v-for="u in inc.sum.badUnits" :key="u.unit">
                  <td class="mono"><b>{{ u.unit }}</b></td><td class="mono">{{ u.n }}</td>
                  <td class="hint mono">{{ u.sample.join(' · ') }}</td></tr></tbody>
              </table>
              <span class="hint">ไม่เดาแทนให้ เพราะเดาถูกเก้าครั้งไม่ได้ชดเชยครั้งที่สิบ —
                แก้หน่วยในไฟล์แล้วลากเข้ามาใหม่</span>
            </div>

            <div class="msg warn" v-if="inc.sum.noUsage.length" style="margin:10px 0 0">
              <b>{{ inc.sum.noUsage.length }} บรรทัดไม่ได้กรอกยอดต่อชิ้น จึงไม่เข้า</b>
              <div class="hint mono" style="margin-top:4px">
                {{ inc.sum.noUsage.slice(0,8).map(r => r.pn + '/' + r.code).join(' · ') }}
                <span v-if="inc.sum.noUsage.length>8"> … อีก {{ inc.sum.noUsage.length-8 }}</span>
              </div>
            </div>

            <div class="msg bad" v-if="bomManualHit.length" style="margin:10px 0 0">
              <b>P/N ที่ติ๊กไว้จะทับบรรทัดที่แก้มือไว้ {{ bomManualHit.length }} บรรทัด</b><br>
              <span class="hint mono">{{ bomManualHit.slice(0,6).map(r => r.pn + '/' + r.code).join(' · ') }}</span><br>
              <span class="hint">การนำเข้าแทนที่ทั้ง P/N เสมอ ถ้ายังต้องการบรรทัดพวกนี้ ต้องคีย์ใหม่หลังนำเข้า</span>
            </div>

            <div class="msg warn" v-if="inc.sum.conflicts || inc.sum.outliers" style="margin:10px 0 0">
              <b>P/N ที่มีบรรทัดโดนทัก ยังไม่ติ๊กไว้ให้</b><br>
              <span class="hint">ไฟล์นี้เป็นแหล่งเดียวแล้ว ไม่มี SAP ไว้เทียบ ตัวเลขที่ผิดสิบเท่าจึงไม่มีอะไรจับได้
                นอกจากตัวข้อมูลเอง — กด "ดู" ข้างล่างเพื่อเทียบก่อนตัดสิน</span>
            </div>
          </div>

          <div class="card">
            <div class="row">
              <h2 style="margin:0">ราย P/N</h2>
              <div class="grow"></div>
              <button class="btn" @click="incPickAll(true)">ติ๊กทั้งหมด</button>
              <button class="btn" @click="incPickAll(false)">ล้างทั้งหมด</button>
            </div>
            <div class="scroll" style="margin-top:10px;max-height:56vh">
              <table>
                <thead><tr><th style="width:44px"></th><th style="width:120px">P/N</th>
                  <th style="width:70px">ชีต</th><th style="width:105px">วันที่ในใบ</th>

        <div class="card" v-if="dupLists.short.length">

          </div>

            เรื่องที่มีความคืบหน้าแล้วไม่อยู่ในนี้ · ยอดต่างกันไม่นับว่าซ้ำ · ติ๊กออกได้ถ้าไม่แน่ใจ · ยกเลิกแบบไม่ลบ ยอดคงคลังไม่เปลี่ยน</p>

                <th style="width:90px">ยอด</th><th style="width:105px">ตั้งวันที่</th><th style="width:110px">ตั้งโดย</th><th>หมายเหตุ</th><th>ซ้ำกับ</th></tr></thead>
              <tbody>
                <tr v-for="d in dupShown('short')" :key="d.row.id">
                  <td><input type="checkbox" :checked="!dupSkip[d.row.id]" @change="dupSkip[d.row.id] = !$event.target.checked"></td>
                  <td class="mono">{{ d.row.po }}</td><td class="mono hint">{{ poDateOf(d.row.po) || '—' }}</td><td class="mono">{{ d.row.code }}</td><td class="hint">{{ catOf(d.row.code) || '—' }}</td>
                  <td class="mono">{{ d.row.qty || '—' }} {{ d.row.unit }}</td>
                  <td class="mono hint">{{ d.row.date }}</td><td class="hint">{{ d.row.created_by || '—' }}</td>
                  <td class="hint">{{ d.row.note || '—' }}</td>
                  <td class="hint">{{ d.why }}</td>
                </tr>
              </tbody>
            </table>
          </div>
          <p class="hint" style="margin:6px 0 0" v-if="dupShow.short && dupLists.short.length > SHOW_MAX">แสดง {{ SHOW_MAX }} จาก {{ dupLists.short.length }} เรื่อง — "ยกเลิกที่ติ๊ก" ทำเฉพาะที่แสดง · ยกเลิกชุดนี้แล้วชุดถัดไปจะขึ้นมา</p>
        </div>

        <div class="card" v-if="fsNoEntity.length">
          <div class="msg warn">ยังไม่รู้ว่าเป็นของนิติบุคคลไหน <b>{{ fsNoEntity.length }}</b> เรื่อง —
            มาจากไฟล์ PO ที่ไม่ได้บอกหน่วยไว้ · ระบบไม่เดาให้ เพราะเดาผิดแล้วเรื่องจะไปโผล่ผิดโรงงาน
            โดยไม่มีอะไรฟ้อง · <b>ตั้งนิติบุคคลที่หัวจอให้ถูกก่อน แล้วกดปุ่มในแถว</b></div>
          <div class="scroll" style="max-height:26vh">
            <table>
              <thead><tr><th style="width:110px">แจ้งวันที่</th><th style="width:125px">PO</th><th style="width:100px">วันที่ PO</th>

                <td><button class="btn" style="padding:2px 8px" :disabled="!entity"
                            @click="fsAssign(s)">เป็นของ {{ entity || '—' }}</button></td>
              </tr></tbody>
            </table>
          </div>
        </div>

        <div class="card">
          <div class="scroll" style="max-height:none">
          <table class="fol even">
            <!-- คอลัมน์ตายตัวทุกปุ่มกรอง — ตัวเลขของทุกใบอยู่แนวเดียวกัน
                 ช่องตัวเลขกว้างเท่ากัน + เว้นหน้าช่องปุ่ม ให้ช่องไฟระหว่างคอลัมน์พอ ๆ กัน (เจ้าของขอ 25 พ.ย. 2026) -->
            <colgroup><col style="width:28px"><col style="width:132px"><col style="width:116px"><col><col style="width:140px"><col style="width:140px"><col style="width:140px"><col style="width:380px"></colgroup>
            <tbody v-for="g in fsDraw" :key="g.po" :class="{ shut: fsFold[g.po] }">
              <tr class="fol-po" @click="foldFlip(fsFold, g.po)" :aria-expanded="!fsFold[g.po]">
                <td colspan="8"><span class="fol-head">
                  <span class="fold-i">{{ fsFold[g.po] ? '▸' : '▾' }}</span>
                  <span class="mono hint">{{ poDateOf(g.po) || 'ไม่มีวันที่' }}</span>
                  <b class="mono">{{ g.po || '(ไม่มีเลข PO)' }}</b>
                  <span class="mono" :class="{ hint: g.items[0].s && fsPn(g.items[0].s).fromPo }"

                <tr v-if="fsSeg === 'new'" class="fol-th"><th></th><th>รหัส</th><th>หมวดหมู่</th><th>วัตถุดิบ</th><th class="r">ตามสูตร</th><th class="r">รับแล้ว</th><th class="r">ขาด</th><th></th></tr>
                <tr v-if="fsSeg === 'open'" class="fol-th"><th></th><th>รหัส</th><th>หมวดหมู่</th><th>วัตถุดิบ · วันที่ตั้งเรื่อง</th><th class="r">ยอดที่ตั้งเรื่อง</th><th class="r">ยอดที่มาแล้ว</th><th class="r">ยอดที่ยังค้าง</th><th>ยอดที่มารอบนี้</th></tr>
                <tr v-if="fsSeg === 'done'" class="fol-th"><th></th><th>รหัส</th><th>หมวดหมู่</th><th>วัตถุดิบ</th><th class="r">วันที่ตั้งเรื่อง</th><th class="r">ยอดที่ตั้งเรื่อง</th><th class="r">วันที่มาครบ</th><th><span class="fol-got">ยอดที่มา</span></th></tr>
                <tr v-if="isStopSeg(fsSeg)" class="fol-th"><th></th><th>รหัส</th><th>หมวดหมู่</th><th>วัตถุดิบ · เหตุผล</th><th class="r">ยอดตาม BOM</th><th class="r">ยอดที่รับเข้า</th><th class="r">ยอดที่ขาด</th><th><span class="fol-got">วันที่หยุดติดตาม</span></th></tr>
                <template v-if="fsSeg === 'new'">
                  <tr v-for="r in g.items" :key="r.code" class="fol-it">
                    <td></td><td class="mono">{{ r.code }}</td><td class="hint">{{ catOf(r.code) || '—' }}</td><td>{{ mrpName(r.code) }}</td>
                    <td class="mono r hint">{{ mrpNum(r.need) }}</td><td class="mono r">{{ mrpNum(r.have) }}</td>
                    <td class="mono r fol-key">{{ mrpNum(r.short) }} <span class="hint">{{ mrpUnit(r.code) }}</span></td>
                    <td class="fol-act"><button class="btn primary" :disabled="!entity || isStarting('short', r)" @click="fsStart(r)">ตั้งเรื่อง short</button>
                      <button class="btn-q" :disabled="!entity || isStarting('short', r)" @click="fsSkip(r)">ไม่ติดตาม</button></td>
                  </tr>
                </template>
                <template v-if="fsSeg === 'open'">
                  <tr v-for="r in g.items" :key="r.s.id" class="fol-it" :data-fid="r.s.id">
                    <td></td><td class="mono">{{ r.s.code }}</td><td class="hint">{{ catOf(r.s.code) || '—' }}</td>
                    <td>{{ mrpName(r.s.code) }}
                      <!-- วันที่ · คนตั้งเรื่อง วางชิดซ้ายของยอดที่ตั้งเรื่อง — สามช่องตัวเลขเหลือไว้ให้เห็นการลบ (เจ้าของขอ 25 พ.ย. 2026) -->
                      <div class="hint">ตั้งเรื่อง <span class="mono">{{ r.s.date || '—' }}</span><template v-if="r.s.created_by"> · {{ r.s.created_by }}</template></div>
                      <!-- ไม่โชว์ ETA แล้ว — ช่องรับ short จากใบ PO (ที่มี ETA) ปิดไปแล้ว (เจ้าของแจ้ง 21 พ.ย. 2026) -->
                      <div v-if="followNote(r.s)" class="hint">{{ followNote(r.s) }}</div></td>
                    <!-- ตั้งไว้ − มาแล้ว = ยังค้าง ให้เห็นการลบในแถวเดียว · เรื่องที่ไม่ได้แจ้งจำนวน = — -->
                    <td class="mono r">{{ r.s.qty > 0 ? mrpNum(r.s.qty) : '—' }} <span v-if="r.s.qty > 0" class="hint">{{ r.s.unit }}</span></td>
                    <td class="mono r">{{ mrpNum(Number(r.s.done_qty) || 0) }} <span v-if="r.s.qty > 0" class="hint">{{ r.s.unit }}</span></td>
                    <td class="mono r fol-key">{{ r.s.qty > 0 ? mrpNum(r.remain) : '—' }} <span v-if="r.s.qty > 0" class="hint">{{ r.s.unit }}</span>
                      <!-- ยอดค้างไม่เท่ากับยอดขาดที่ระบบคิดจากการรับเข้าเทียบสูตร = ป้าย ต่าง อย่างเดียว · ตัวเลขอยู่ในกล่องข้อความตอนชี้เมาส์ (เจ้าของสั่ง 26 พ.ย. 2026) -->
                      <div v-if="fsCheck(r.s).same === false" style="font-weight:400"><span class="tag warn" style="cursor:help"

                    <td class="fol-act">
                      <!-- ช่องจำนวนทุกแถว (เจ้าของสั่ง 10 ต.ค. 2026) · เว้นว่าง = มาครบ · เรื่องที่ไม่ระบุจำนวนต้องใส่ เพราะรับเข้าคลังทุกครั้ง (26 พ.ย. 2026) -->
                      <input v-model="fsGot[r.s.id]" type="number" step="any" class="mono fol-qty"
                             :placeholder="r.s.qty > 0 ? 'ทั้งใบ' : 'จำนวน'"
                             :title="r.s.qty > 0 ? '' : 'เรื่องนี้ไม่ได้บอกจำนวนไว้ — ใส่จำนวนที่มาก่อนกด มาแล้ว'"
                             @keyup.enter="fsClose(r.s)">
                      <button class="btn primary" :disabled="starting.has('fsclose|' + r.s.id)" @click="fsClose(r.s)">มาแล้ว</button>
                      <button class="btn-q" :disabled="starting.has('fsvoid|' + r.s.id)" @click="fsVoid(r.s)">ยกเลิกเรื่อง</button></td>
                  </tr>
                </template>
                <template v-if="fsSeg === 'done'">
                  <tr v-for="r in g.items" :key="r.s.id" class="fol-it" :data-fid="r.s.id">
                    <td></td><td class="mono">{{ r.s.code }}</td><td class="hint">{{ catOf(r.s.code) || '—' }}</td><td>{{ mrpName(r.s.code) }}</td>
                    <!-- เรียงเป็นคู่ ตั้งเรื่อง (วันที่ · ยอด qty) แล้วมาครบ (วันที่ · ยอด done_qty) (เจ้าของขอ 24 พ.ย. 2026) · เรื่องจากไฟล์ PO ที่ไม่บอกจำนวน = — -->
                    <td class="mono r hint">{{ r.s.date }}<div v-if="r.s.created_by">{{ r.s.created_by }}</div></td>
                    <td class="mono r">{{ r.s.qty > 0 ? mrpNum(r.s.qty) : '—' }} <span v-if="r.s.qty > 0" class="hint">{{ r.s.unit }}</span></td>
                    <td class="mono r hint">{{ localDate(r.s.done_at) }}<div v-if="r.s.done_by">{{ r.s.done_by }}</div></td>
                    <td class="fol-act"><span class="fol-got mono fol-key">{{ r.s.done_qty > 0 ? mrpNum(r.s.done_qty) : '—' }} <span v-if="r.s.done_qty > 0" class="hint">{{ r.s.unit }}</span></span>
                      <button class="btn-q" @click="fsReopen(r.s)">เอากลับ</button></td>
                  </tr>

                <template v-if="isStopSeg(fsSeg)">

                    <td>{{ mrpName(x.s.code) }}
                      <div class="hint"><span class="tag" :class="x.mark === 'skip' ? 'mute' : 'warn'">{{ x.mark === 'skip' ? 'ไม่ติดตาม' : 'ยกเลิกเรื่อง' }}</span> {{ stopWhy(x.s) || '(ไม่ได้ใส่เหตุผล)' }}</div></td>
                    <!-- หลักฐานว่าขาดน้อยจริงจึงหยุดตาม: ตาม BOM − รับเข้า = ขาด แล้ววันที่+คนที่หยุด (เจ้าของสั่ง 24 พ.ย. 2026)
                         ไม่มีวันที่ตั้งเรื่อง — หลายแถวไม่ติดตามตั้งแต่ยังไม่ตั้งเรื่อง · ตัวเลขคิดใน stopEvidence (master/follow.js) -->
                    <td class="mono r hint">{{ stopEvidence(x.s).bom == null ? '—' : mrpNum(stopEvidence(x.s).bom) }}</td>
                    <td class="mono r hint">{{ stopEvidence(x.s).recv == null ? '—' : mrpNum(stopEvidence(x.s).recv) }}</td>
                    <td class="mono r fol-key">{{ mrpNum(stopEvidence(x.s).short) }} <span class="hint">{{ x.s.unit }}</span></td>
                    <td class="fol-act"><span class="fol-got mono hint">{{ localDate(x.s.void_at) }}<div v-if="x.s.void_by">{{ x.s.void_by }}</div></span>
                      <button class="btn" :disabled="starting.has('fsrestart|' + x.s.id)" @click="fsRestart(x.s)">กลับมาติดตาม</button></td>
                  </tr>
                </template>
              </template>
            </tbody>
            <tbody v-if="!fsGroups.length"><tr><td colspan="8" class="empty">
              {{ fsSearch ? 'ไม่มีเรื่องที่ตรงกับคำค้น' : fsSeg === 'new' ? 'ไม่มี PO ที่รับไม่ครบตาม BOM โดยยังไม่มีเรื่อง'

          </table>

          <details class="fol-help">
            <summary>วิธีคิดยอด และปุ่มแต่ละปุ่ม</summary>
            <p><b>ต้องตั้งเรื่อง</b> = ต่อชิ้น × จำนวนสั่ง − (รับเข้า − ส่งคืน) · เฉพาะ PO ที่เริ่มรับแล้ว ·
              ของมาเป็นรอบ ยอดขาดตรงนี้รวมของที่ยังไม่ถึงรอบด้วย · <b>กดตั้งเรื่องเมื่อแน่ใจว่าใบนั้นไม่มีของมาเพิ่มแล้ว</b><br>
              PO+รหัสที่มีเรื่องเปิดอยู่แล้ว (รวมที่ Delta แจ้ง) ไม่ขึ้นซ้ำ ·
              คู่ที่เพิ่งปิดเรื่องไปด้วยยอดเท่ากับยอดขาดตอนนี้ก็ไม่ขึ้น (ยอดต่างจากเดิมจะขึ้นให้ตั้งเรื่องได้) ·
              ถ้าต้องตั้งเรื่องคู่ที่ถูกซ่อน ใช้ปุ่ม <b>เพิ่มเรื่องเอง</b> · นับทุกยอดที่ขาด <b>ยกเว้นเศษจากสูตร</b> ของรหัสที่รับมาแล้วบ้าง ที่ต่ำกว่าเกณฑ์ของหน่วย (ชิ้น {{ FRAC_TOL.PCE }} · กก. {{ FRAC_TOL.KGM }} · ม. {{ FRAC_TOL.MTR }}) ซึ่งไม่ขึ้นการ์ดนี้ ·
              กด <b>ไม่ติดตาม</b> = ไม่ขึ้นอีกจนกว่ายอดขาดจะมากกว่ายอดในแถวตอนกด</p>
            <p><b>มาแล้ว</b> เว้นช่องยอดไว้ = ปิดทั้งเรื่อง ·
              ใส่ยอดก่อนกด (หรือกด Enter ในช่อง) = ของมาบางส่วน แล้วจะเหลือค้างตามส่วนต่าง<br>
              กด <b>มาแล้ว</b> = บันทึกรับเข้าคลังให้เลยทุกครั้ง อ้าง PO ของเรื่อง · ล็อต = <b>วันที่ของมา</b> (ค่าตั้งต้นคือวันนี้ แก้ย้อนหลังได้) — ไม่ต้องไปคีย์ที่หน้ารับเข้าซ้ำ ·
              กด <b>เอากลับ</b> = ยกเลิกรายการรับเข้านั้นให้ด้วย<br>
              แถวที่ไม่ได้บอกจำนวน (ช่องขึ้นว่า "จำนวน") ต้องใส่จำนวนที่มาก่อนกด<br>
              ป้าย <b>ต่าง</b> ใต้ <b>ยอดที่ยังค้าง</b> = ยอดขาดที่<b>ระบบคิดได้</b>จากการรับเข้าเทียบสูตรตอนนี้ ไม่เท่ากับยอดที่ยังค้าง
              — ชี้เมาส์ที่ป้ายเพื่อดูทั้งสองยอด แล้วไปดูว่าของที่มาแล้วถูกรับเข้าคลังครบหรือยัง · เท่ากันไม่ขึ้นป้าย</p>
            <p><b>ยกเลิกแล้ว</b> / <b>ไม่ติดตามแล้ว</b> = เรื่องที่กด "ยกเลิกเรื่อง" / "ไม่ติดตาม" แยกกันคนละปุ่ม · ไม่ลบทิ้ง ·
              ไม่ขึ้นในปุ่ม "ต้องตั้งเรื่อง" จนกว่ายอดขาดจะมากกว่า <b>ยอดค้าง</b> ตอนกด ·
              กดกลับมาติดตามหรือตั้งเรื่องใหม่แล้ว = ขึ้นตามปกติ · นำเข้าไฟล์ Delta ซ้ำด้วยยอดเท่าเดิมไม่สร้างใหม่</p>
          </details>

            <p><b>ต้องตั้งเรื่อง</b> = รับเข้าตามใบ − ที่คืนไปแล้ว − ยอดตามสูตรของใบนั้น · ยอดที่ต่ำกว่า 1 หน่วยไม่นับว่าเกิน</p>
            <p>ยอดตอนตั้งเรื่องคือค่า ณ วันที่ตั้งเรื่อง — ใบรับเข้าที่คีย์ทีหลังจะไม่ทำให้ยอดของเรื่องนี้ขยับเอง<br>
              กด <b>คืนของ</b> แล้วเลือกแบบ —
              <b>1 คืน Delta</b> = ตัดของออกจากคลังจริง ขึ้นเป็นฝั่งจ่ายออกบน Bin Card ·
              <b>2 ทดแทน short ที่ค้าง</b> = ส่งคืนจาก PO ของ over คู่กับรับเข้า PO ของเรื่อง short ยอดเท่ากัน คงคลังเท่าเดิม และยอดค้างของเรื่อง short ลดตาม<br>
              คืนจนคงคลังติดลบได้ — หน้ายอดคงคลังจะขึ้นว่าจ่ายเกิน ให้ไปแก้รายการจ่ายที่ผิด<br>
              กด <b>เอากลับ</b> (คืนผิด หรือคืนซ้ำ) = เปิดเรื่องใหม่ และยกเลิกรายการส่งคืนที่ผูกไว้ทุกรอบ — ยอดคงคลังกลับมา ·
              ถ้าเป็นแบบ 2 รายการรับเข้าคู่ถูกยกเลิกด้วย และเรื่อง short ได้ยอดค้างคืน</p>
            <p><b>ยกเลิกแล้ว</b> / <b>ไม่ติดตามแล้ว</b> = เรื่องที่กด "ยกเลิกเรื่อง" / "ไม่ติดตาม" แยกกันคนละปุ่ม · ไม่ลบทิ้ง · ของยังอยู่ในคลัง ·
              ไม่ขึ้นในปุ่ม "ต้องตั้งเรื่อง" จนกว่ายอดเกินจะมากกว่า <b>ยอดค้าง</b> ตอนกด ·
              กดกลับมาติดตามหรือตั้งเรื่องใหม่แล้ว = ขึ้นตามปกติ · นำเข้าไฟล์ Delta ซ้ำด้วยยอดเท่าเดิมไม่สร้างใหม่</p>
          </details>
        </div>
