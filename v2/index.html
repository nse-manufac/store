<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="app-version" content="2026-08-16.1">
<title>ระบบ Bin Card v2</title>

<!--
  ⚠️ ไลบรารีทั้งหมดอยู่ในเครื่อง ห้ามเปลี่ยนไปโหลดจากเน็ต
  v1 โหลดจาก cdnjs ทุกครั้งที่เปิด เน็ตโรงงานบล็อกเมื่อไหร่ก็หน้าขาวสนิท
  ทั้งที่ข้อมูลอยู่ในเครื่องครบและไม่ต้องใช้เน็ตทำงานเลย — ดู lib/README.md
-->
<script src="lib/vue.global.prod.js"></script>

<style>
:root{
  /* สีชุดเดียวกับ v1 โดยตั้งใจ — พนักงานจะใช้สองตัวคาบเกี่ยวกันช่วงเปลี่ยนผ่าน
     ถ้าหน้าตาต่างกันมากจะรู้สึกเหมือนต้องเรียนโปรแกรมใหม่ทั้งตัว */
  --bg:#f4f6f9;--panel:#fff;--line:#dde3ea;--ink:#1c2733;--muted:#68778a;
  --brand:#1f4e79;--soft:#e8f0f8;--ok:#1a7f4b;--okbg:#e6f5ed;
  --warn:#b06d00;--warnbg:#fff6e0;--bad:#c02626;--badbg:#fdecec;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Segoe UI","Sarabun","Noto Sans Thai",system-ui,sans-serif;font-size:14px}
#app{min-height:100vh;display:flex;flex-direction:column}
header{background:var(--brand);color:#fff;padding:9px 16px;display:flex;
  align-items:center;gap:14px;flex-wrap:wrap}
header h1{margin:0;font-size:15px;font-weight:600}
header .ver{font-size:11px;opacity:.75;padding:1px 7px;border:1px solid rgba(255,255,255,.4);
  border-radius:99px;font-variant-numeric:tabular-nums}
header .grow{flex:1}
header .who{font-size:12px;opacity:.9}
.tabs{display:flex;gap:3px;flex-wrap:wrap}
.tabs button{background:rgba(255,255,255,.12);color:#fff;border:0;padding:7px 14px;
  border-radius:5px 5px 0 0;font:inherit;font-size:13px;cursor:pointer}
.tabs button.on{background:var(--bg);color:var(--brand);font-weight:600}
main{padding:14px 16px 60px;flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:14px 16px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:14px;color:var(--brand)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
input,select{font:inherit;font-size:14px;padding:7px 9px;border:1px solid var(--line);
  border-radius:6px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--brand);outline-offset:-1px}
.btn{font:inherit;font-size:13px;padding:8px 15px;border:1px solid var(--line);
  border-radius:6px;background:#fff;cursor:pointer}
.btn:hover{background:#f0f4f8}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:600}
.btn.primary:hover{filter:brightness(1.12)}
.btn:disabled{opacity:.45;cursor:not-allowed}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#eef2f7;text-align:left;padding:7px 8px;border-bottom:2px solid var(--line);
  font-size:11px;color:var(--muted);white-space:nowrap;position:sticky;top:0}
td{padding:6px 8px;border-bottom:1px solid #f0f3f6;vertical-align:top}
tr.review td{background:#fffdf3}
.mono{font-family:ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums}
.scroll{max-height:60vh;overflow:auto}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;
  background:var(--soft);color:var(--brand);white-space:nowrap}
.tag.ok{background:var(--okbg);color:var(--ok)}
.tag.warn{background:var(--warnbg);color:var(--warn)}
.tag.bad{background:var(--badbg);color:var(--bad)}
.msg{padding:9px 12px;border-radius:6px;margin-bottom:10px;font-size:13px}
.msg.ok{background:var(--okbg);color:var(--ok);border:1px solid #b9e2cb}
.msg.warn{background:var(--warnbg);color:var(--warn);border:1px solid #f0d799}
.msg.bad{background:var(--badbg);color:var(--bad);border:1px solid #f0c4c4}
.hint{font-size:12px;color:var(--muted)}
.drop{border:2px dashed var(--line);border-radius:10px;padding:30px;text-align:center;transition:.15s}
.drop.over{border-color:var(--brand);background:var(--soft)}
.big{font-size:28px;font-weight:700;color:var(--brand);line-height:1.15;
  font-variant-numeric:tabular-nums}
.big.bad{color:var(--bad)} .big.warn{color:var(--warn)}
textarea{font:inherit}
.printonly{display:none}
.modal{position:fixed;inset:0;background:rgba(18,32,44,.45);display:flex;
  align-items:flex-start;justify-content:center;padding:60px 16px;z-index:40}
.modal-box{background:var(--panel);border-radius:10px;padding:16px;width:min(760px,100%);
  box-shadow:0 12px 40px rgba(0,0,0,.3)}
.modal-box tbody tr:hover{background:var(--soft)}

/* ── ใบนับตอนพิมพ์ ──
   ช่อง "นับได้" ต้องเป็นกรอบว่างให้เขียนด้วยมือ ไม่ใช่ช่องกรอกบนจอที่พิมพ์ออกมาว่าง ๆ
   และห้ามมียอดของระบบโผล่มาในใบนับเด็ดขาด — ดูเหตุผลใน core/count.js */
@media print{
  header,.noprint,.tabs{display:none !important}
  body{background:#fff}
  main{padding:0}
  .card{border:0;padding:0;margin:0}
  .printonly{display:flex;justify-content:space-between;align-items:baseline;
    margin-bottom:10px;font-size:13px}
  .scroll{max-height:none;overflow:visible}
  table{font-size:12px}
  th{background:#fff;border-bottom:1.5px solid #000;position:static}
  td{border-bottom:1px solid #ccc;padding:7px 8px}
  .countcell{border:1px solid #000;min-width:90px}
  tr{page-break-inside:avoid}
}
.empty{padding:26px;text-align:center;color:var(--muted)}
.boot{padding:60px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);
  color:#fff;padding:10px 20px;border-radius:8px;font-size:14px;z-index:50;
  box-shadow:0 6px 22px rgba(0,0,0,.28)}
.toast.bad{background:var(--bad)}
</style>
</head>
<body>
<div id="app">
  <div class="boot" v-if="!ready">{{ bootMsg }}</div>

  <template v-else>
    <header>
      <h1>ระบบ Bin Card</h1>
      <span class="ver">v{{ APP_VERSION }}</span>
      <div class="tabs">
        <button v-for="t in TABS" :key="t.k" :class="{on:tab===t.k}" @click="tab=t.k">
          {{ t.label }}<span v-if="t.k==='mat' && needReview" class="badge"> {{ needReview }}</span>
        </button>
      </div>
      <div class="grow"></div>
      <span class="who">{{ entity || 'ยังไม่เลือกนิติบุคคล' }}</span>
    </header>

    <main>
      <div class="msg bad" v-if="bootError">{{ bootError }}</div>

      <!-- ════════ ทะเบียนวัตถุดิบ ════════ -->
      <template v-if="tab==='mat'">
        <div class="card">
          <div class="row">
            <label class="f grow" style="min-width:240px">ค้นหา
              <input v-model.trim="q" placeholder="พิมพ์รหัสหรือชื่อ เช่น 3220130200 หรือ TAPE PLE">
            </label>
            <label class="f">หมวด
              <select v-model="fCat">
                <option value="">ทุกหมวด</option>
                <option v-for="c in CATEGORIES" :key="c" :value="c">{{ c }}</option>
              </select>
            </label>
            <label class="f">แสดง
              <select v-model="fState">
                <option value="active">ที่ใช้งานอยู่</option>
                <option value="review">รอตรวจ</option>
                <option value="all">ทั้งหมด</option>
              </select>
            </label>
            <button class="btn primary" @click="startAdd">+ เพิ่มรหัสใหม่</button>
          </div>
          <p class="hint" style="margin:9px 0 0">
            ทะเบียนในเครื่อง <b>{{ materials.length.toLocaleString() }}</b> รายการ ·
            ใช้งานอยู่ {{ activeCount.toLocaleString() }}
            <span v-if="needReview"> · <span class="tag warn">รอคุณตรวจ {{ needReview }}</span></span>
          </p>
        </div>

        <!-- ── ฟอร์มเพิ่ม/แก้ ── -->
        <div class="card" v-if="edit">
          <h2>{{ edit._new ? 'เพิ่มรหัสใหม่' : 'แก้ไข ' + edit.material_code }}</h2>
          <div class="row">
            <label class="f" style="width:170px">รหัสวัตถุดิบ
              <input v-model.trim="edit.material_code" class="mono" :disabled="!edit._new"
                     placeholder="เช่น 3220130200">
            </label>
            <label class="f grow" style="min-width:260px">ชื่อ / คำอธิบาย
              <input v-model.trim="edit.description" placeholder="ชื่อที่พนักงานเรียกกันจริง">
            </label>
            <label class="f" style="width:90px">หน่วย
              <input v-model.trim="edit.unit" class="mono" placeholder="PCE">
            </label>
            <label class="f" style="width:140px">หมวด
              <select v-model="edit.category">
                <option v-for="c in CATEGORIES" :key="c" :value="c">{{ c }}</option>
              </select>
            </label>
          </div>
          <div class="row" style="margin-top:9px">
            <label class="row" style="gap:6px;font-size:13px">
              <input type="checkbox" v-model="edit.requires_expiry"> ต้องกรอกวันหมดอายุ</label>
            <label class="row" style="gap:6px;font-size:13px">
              <input type="checkbox" v-model="edit.active"> ใช้งานอยู่</label>
            <div class="grow"></div>
            <button class="btn" @click="edit=null">ยกเลิก</button>
            <button class="btn primary" @click="saveEdit" :disabled="codeCheck.level==='bad'">บันทึก</button>
          </div>

          <div class="msg bad" v-if="codeCheck.level==='bad'" style="margin:10px 0 0">
            {{ codeCheck.msg }}</div>
          <div class="msg warn" v-else-if="codeCheck.level==='warn'" style="margin:10px 0 0">
            ⚠️ {{ codeCheck.msg }}<br>
            <span class="hint">บันทึกต่อได้ ระบบจะทำเครื่องหมายไว้ให้เจ้าของตรวจอีกที</span></div>
          <div class="msg warn" v-if="edit._new && dupOf(edit.description).length" style="margin:10px 0 0">
            มีของชื่อนี้อยู่แล้ว {{ dupOf(edit.description).length }} รหัส —
            <span class="mono">{{ dupOf(edit.description).join(' · ') }}</span><br>
            <span class="hint">ถ้าเป็นของตัวเดียวกัน ใช้รหัสเดิมดีกว่า จะได้ไม่มีสองรายการที่แยกกันไม่ออก</span></div>
        </div>

        <!-- ── รายการ ── -->
        <div class="card">
          <div class="scroll">
            <table>
              <thead><tr>
                <th style="width:120px">รหัส</th><th>ชื่อ</th>
                <th style="width:70px">หน่วย</th><th style="width:110px">หมวด</th>
                <th style="width:90px">สถานะ</th><th style="width:120px"></th>
              </tr></thead>
              <tbody>
                <tr v-for="m in shown" :key="m.material_code" :class="{review:m.needs_review}">
                  <td class="mono"><b>{{ m.material_code }}</b></td>
                  <td>{{ m.description || '(ยังไม่มีชื่อ)' }}
                    <span v-if="m.dupDesc" class="tag warn" title="มีของชื่อเดียวกันหลายรหัส ดูที่รหัสให้ดี">ชื่อซ้ำ</span>
                  </td>
                  <td class="mono">{{ m.unit }}</td>
                  <td><span class="tag">{{ m.category }}</span></td>
                  <td>
                    <span v-if="m.needs_review" class="tag warn">รอตรวจ</span>
                    <span v-else-if="!m.active" class="tag bad">ปิดใช้งาน</span>
                    <span v-else class="tag ok">ใช้งานอยู่</span>
                  </td>
                  <td>
                    <button class="btn" style="padding:3px 9px" @click="startEdit(m)">แก้</button>
                    <button v-if="m.needs_review" class="btn" style="padding:3px 9px;margin-left:4px"
                            @click="approve(m)">ตรวจแล้ว</button>
                  </td>
                </tr>
              </tbody>
            </table>
            <p v-if="!shown.length" class="empty">
              ไม่เจอรายการที่ตรงกับที่ค้น<br>
              <span class="hint">ถ้าของอยู่ตรงหน้าแต่ไม่มีในทะเบียน กด "เพิ่มรหัสใหม่" ได้เลย</span>
            </p>
            <p v-else-if="shown.length>=SHOW_MAX" class="hint" style="padding:8px">
              แสดง {{ SHOW_MAX }} รายการแรก — พิมพ์ค้นให้แคบลงเพื่อดูตัวอื่น
            </p>
          </div>
        </div>
      </template>

      <!-- ════════ BOM ════════ -->
      <template v-else-if="tab==='bom'">
        <div class="card">
          <div class="drop" :class="{over:dragOver}"
               @dragover.prevent="dragOver=true" @dragleave="dragOver=false"
               @drop.prevent="onDropBom">
            <b style="font-size:16px">ลากไฟล์ BOM จาก SAP มาวางตรงนี้</b>
            <p class="hint" style="margin:6px 0 0">
              1 ไฟล์ = 1 P/N · ลากพร้อมกันหลายไฟล์ได้ · ไฟล์ .html ที่ออกจาก REPORT YTRPBOM1</p>
            <p style="margin:12px 0 0"><input type="file" accept=".html,.htm" multiple @change="onPickBom"></p>
          </div>
        </div>

        <!-- ── ผลการอ่าน รอกดยืนยัน ── -->
        <template v-if="bomPlan">
          <div class="card">
            <h2>อ่านไฟล์แล้ว — ตรวจก่อนนำเข้า</h2>
            <div class="row" style="gap:26px;align-items:flex-start">
              <div><div class="hint">จะนำเข้า</div>
                <div class="big">{{ bomSum.lines.toLocaleString() }}</div>
                <div class="hint">บรรทัด จาก {{ bomSum.pns }} P/N</div></div>
              <div v-if="bomSum.blocked"><div class="hint">ไม่ให้เข้าเพราะหน่วยไม่รู้จัก</div>
                <div class="big bad">{{ bomSum.blocked }}</div>
                <div class="hint">บรรทัด</div></div>
              <div v-if="bomSum.unconfirmed"><div class="hint">หน่วยยังไม่ยืนยัน</div>
                <div class="big warn">{{ bomSum.unconfirmed }}</div>
                <div class="hint">บรรทัด</div></div>
              <div v-if="bomSum.inhouse"><div class="hint">ของทำเองที่กันออก</div>
                <div class="big">{{ bomSum.inhouse }}</div>
                <div class="hint">บรรทัด</div></div>
              <div class="grow"></div>
              <button class="btn primary" @click="applyBom" :disabled="bomBusy">
                {{ bomBusy ? 'กำลังนำเข้า...' : 'นำเข้า' }}</button>
              <button class="btn" @click="bomPlan=null;bomDocs=[]">ยกเลิก</button>
            </div>

            <div class="msg bad" v-if="bomPlan.failed.length" style="margin:12px 0 0">
              <b>อ่านไม่ได้ {{ bomPlan.failed.length }} ไฟล์</b>
              <div v-for="(f,i) in bomPlan.failed" :key="i" class="hint">{{ f.fileName }}: {{ f.error }}</div>
            </div>
            <div class="msg warn" v-if="bomPlan.dupInBatch.length" style="margin:10px 0 0">
              มี P/N ซ้ำในชุดที่ลากมา: <b class="mono">{{ bomPlan.dupInBatch.join(', ') }}</b> —
              ไฟล์ที่มาทีหลังจะทับตัวก่อนหน้า
            </div>
            <div class="msg bad" v-if="bomSum.blocked" style="margin:10px 0 0">
              <b>⚠️ {{ bomSum.blocked }} บรรทัดไม่ได้เข้า เพราะโปรแกรมยังไม่รู้ตัวคูณของหน่วยเหล่านี้</b>
              <table style="margin:8px 0 0;max-width:620px;background:#fff">
                <thead><tr><th style="width:80px">หน่วย</th><th style="width:90px">บรรทัด</th><th>ตัวอย่าง</th></tr></thead>
                <tbody><tr v-for="u in bomSum.blockedUoms" :key="u.uom">
                  <td class="mono"><b>{{ u.uom }}</b></td><td class="mono">{{ u.n }}</td>
                  <td class="hint mono">{{ u.sample.join(' · ') }}</td></tr></tbody>
              </table>
              <span class="hint">ต้องถาม Delta ว่าหน่วยนี้หมายถึงอะไร แล้วเติมลงตารางแปลงก่อน
                — ปล่อยเข้าไปด้วยการเดาจะทำให้ยอดผิดโดยไม่มีใครรู้</span>
            </div>
            <div class="msg warn" v-if="bomSum.unconfirmed" style="margin:10px 0 0">
              <b>{{ bomSum.unconfirmed }} บรรทัดใช้หน่วยที่ยังไม่ได้ยืนยันกับ Delta</b><br>
              <span class="hint">แปลงให้แล้วตามหลักฐานที่มี แต่ทุกที่ที่ใช้ตัวเลขนี้จะขึ้นป้ายกำกับไว้
                จนกว่าจะได้คำยืนยัน</span>
            </div>
          </div>

          <div class="card">
            <h2>ราย P/N</h2>
            <div class="scroll">
              <table>
                <thead><tr><th style="width:120px">P/N</th><th style="width:60px">REV</th>
                  <th style="width:110px">มีผลตั้งแต่</th><th style="width:90px">จะเข้า</th>
                  <th style="width:120px">ทับของเดิม</th><th>หมายเหตุ</th></tr></thead>
                <tbody><tr v-for="p in bomPlan.perPn" :key="p.pn">
                  <td class="mono"><b>{{ p.pn }}</b></td><td class="mono">{{ p.rev }}</td>
                  <td class="mono">{{ p.valid_from }}</td>
                  <td class="mono">{{ p.incoming }}</td>
                  <td><span v-if="p.isNew" class="tag ok">P/N ใหม่</span>
                      <span v-else class="tag warn">ทิ้งของเดิม {{ p.replacing }} บรรทัด</span></td>
                  <td class="hint">
                    <span v-if="p.blocked">หน่วยติด {{ p.blocked }} · </span>
                    <span v-if="p.unconfirmed">ยังไม่ยืนยัน {{ p.unconfirmed }} · </span>
                    <span v-if="p.inhouse">ของทำเอง {{ p.inhouse }}</span>
                  </td>
                </tr></tbody>
              </table>
            </div>
          </div>
        </template>

        <!-- ── BOM ที่เก็บไว้แล้ว ── -->
        <div class="card">
          <div class="row">
            <h2 style="margin:0">BOM ในเครื่อง</h2>
            <span class="tag">{{ bomPns.length }} P/N · {{ bom.length.toLocaleString() }} บรรทัด</span>
            <div class="grow"></div>
            <span v-if="bomUnconfirmed" class="tag warn">หน่วยยังไม่ยืนยัน {{ bomUnconfirmed }} บรรทัด</span>
          </div>

          <div class="msg warn" v-if="missingPack.length" style="margin:12px 0 0">
            <b>{{ missingPack.length }} P/N ยังไม่มีวัสดุแพ็กกิ้งในสูตรเลย</b><br>
            <span class="hint">Delta ทยอยใส่ pack mat เข้ามาทีละ REV — ตราบใดที่ยังใช้ของเก่า
              ความต้องการแพ็กกิ้งของ P/N พวกนี้จะมองไม่เห็นทั้งก้อน ควรขอฉบับใหม่</span>
            <div class="mono hint" style="margin-top:6px">
              {{ missingPack.slice(0,12).map(p => p.pn + ' (REV ' + p.rev + ')').join(' · ') }}
              <span v-if="missingPack.length>12"> … อีก {{ missingPack.length-12 }}</span>
            </div>
          </div>

          <div class="msg warn" v-if="bomUnknownCodes.length" style="margin:10px 0 0">
            <div class="row">
              <div class="grow">
                <b>{{ bomUnknownCodes.length }} รหัสใน BOM ที่ยังไม่มีในทะเบียน</b><br>

                <td class="mono"><b>{{ l.qty }}</b></td>
                <td class="mono hint">{{ localDate(l.first) }}</td>
                <td class="noprint"><button class="btn" style="padding:2px 9px"
                  @click="traceOf = (l.lot || '(ว่าง)')">ตามรอยล็อตนี้</button></td>
              </tr></tbody></table>
          </div>

          <!-- ตามรอยย้อนกลับ — คำถามที่ลูกค้าถามตอนของมีปัญหา -->

                ระบบไล่ให้ตามลำดับของเก่าก่อน บอกลูกค้าได้ว่า "น่าจะ" ไม่ใช่ "แน่นอน"</span>
            </div>
            <div class="row" style="gap:28px;margin:10px 0">
              <div><div class="hint">รับเข้า</div><div class="big">{{ trace.received }}</div></div>
              <div><div class="hint">ใช้ไป</div><div class="big">{{ trace.used }}</div></div>
              <div><div class="hint">เหลือ</div><div class="big">{{ trace.remaining }}</div></div>
            </div>
            <table v-if="trace.jobs.length">
              <thead><tr><th style="width:150px">ไปอยู่ในงาน</th><th style="width:110px">จำนวน</th>

            </table>
            <p v-else class="hint">ยังไม่มีการจ่ายออกจากล็อตนี้</p>
          </div>

          <div class="card">
            <div class="row" style="margin-bottom:8px">
              <h2 style="margin:0">ความเคลื่อนไหว</h2>
              <span class="hint">ใหม่สุดอยู่บน · ช่อง "คงเหลือ" คือยอดสะสมถึงบรรทัดนั้น</span>
            </div>

              <table>
                <thead><tr><th style="width:100px">วันที่</th><th style="width:85px">ประเภท</th>
                  <th style="width:90px">เข้า/ออก</th><th style="width:95px">คงเหลือ</th>

              <div class="row" style="gap:3px;flex-wrap:nowrap">
                <input v-model.trim="mk.code" class="mono grow" @change="onMkCode">

              <input v-model.number="mk.qty" type="number" step="any" class="mono"></label>

              <input v-model.number="mk.counted" type="number" step="any" class="mono"></label>

              <input v-model.trim="mk.person"></label>

            <label class="f grow">หมายเหตุ<span v-if="mk.reason==='other'" style="color:var(--bad)">

          </div>

          <div class="row" style="margin-top:14px;gap:26px;align-items:flex-start">

              <td class="mono hint">{{ localDate(l.first) }}</td>

        <p class="empty">หน้านี้ยังไม่ได้ทำ — กำลังสร้างทีละส่วน</p>
      </div>

      <!-- รายการ P/N ใช้ร่วมกันหลายหน้า จึงต้องอยู่นอกแท็บ ไม่งั้นหน้าที่ไม่ได้เปิดจะหาไม่เจอ -->
      <datalist id="pnlist"><option v-for="p in bomPnCodes" :key="p" :value="p"></option></datalist>

      <!-- ════════ ตั้งทะเบียนจาก BOM ════════ -->
      <div class="modal" v-if="regDraft" @click.self="regDraft=null">
        <div class="modal-box" style="width:min(1100px,100%)">
          <div class="row">
            <h2 style="margin:0">ตั้งทะเบียนจาก BOM</h2>
            <div class="grow"></div>
            <span class="hint">เลือกไว้ {{ regTake.length }} จาก {{ regDraft.length }}</span>
            <button class="btn" @click="regDraft=null">ปิด</button>
          </div>

          <p class="hint" style="margin:8px 0">
            ทุกตัวจะถูกติดธง <b>รอตรวจ</b> ไว้ เพราะ BOM บอกวันหมดอายุไม่ได้ และหมวดเป็นแค่การเดาจากชื่อ
            — หมวด CHEMICAL จะถูกตั้งให้ต้องกรอกวันหมดอายุอัตโนมัติ
          </p>

          <div class="msg warn" v-if="regPlan.unitVaries || regPlan.noUnit || regPlan.dupDesc">
            <span v-if="regPlan.unitVaries"><b>{{ regPlan.unitVaries }} รหัสมีหน่วยไม่ตรงกันข้าม P/N</b>
              — ต้องดูก่อนว่าจะเอาหน่วยไหน เพราะตัวเลขในสูตรจะคนละมาตราส่วน<br></span>
            <span v-if="regPlan.noUnit">{{ regPlan.noUnit }} รหัสไม่มีหน่วยใน BOM เลย<br></span>
            <span v-if="regPlan.dupDesc">{{ regPlan.dupDesc }} รหัสมีชื่อซ้ำกับรหัสที่มีอยู่แล้วในทะเบียน
              — เช็กว่าไม่ใช่ของเดียวกันคนละรหัส (issue #26)</span>
          </div>
          <div class="msg ok" v-if="regPlan.inHouseSkipped.length">
            ข้ามของที่เราทำเอง {{ regPlan.inHouseSkipped.length }} รหัสให้แล้ว
            <span class="mono hint">{{ regPlan.inHouseSkipped.slice(0,5).join(' · ') }}</span><br>
            <span class="hint">พวกนี้คืองานที่เราพันเอง ไม่ใช่ของที่ซื้อเข้ามา ไม่ควรอยู่ในทะเบียนวัตถุดิบ</span>
          </div>

          <div class="scroll" style="margin-top:10px;max-height:50vh">
            <table>
              <thead><tr>
                <th style="width:34px"></th><th style="width:115px">รหัส</th><th>ชื่อ</th>
                <th style="width:70px">หน่วย</th><th style="width:130px">หมวด</th>
                <th style="width:200px">ใช้ใน P/N</th>
              </tr></thead>
              <tbody>
                <tr v-for="r in regDraft" :key="r.code" :class="{review: r.unitVaries || r.dupDesc.length}">
                  <td><input type="checkbox" v-model="r.take" style="width:16px;height:16px"></td>
                  <td class="mono"><b>{{ r.code }}</b></td>
                  <td>
                    <input v-model.trim="r.desc" style="width:100%;font-size:13px">
                    <div class="hint" v-if="r.descVaries">
                      ชื่ออื่นที่พบ: <span class="mono">{{ r.otherDescs.join(' · ') }}</span></div>
                    <div class="hint" v-if="r.dupDesc.length">
                      <span class="tag warn">ชื่อซ้ำกับ {{ r.dupDesc.join(' · ') }}</span></div>
                  </td>
                  <td>
                    <input v-model.trim="r.unit" class="mono" style="width:58px">
                    <div v-if="r.unitVaries"><span class="tag bad">พบ {{ r.units.join('/') }}</span></div>
                    <div v-if="r.noUnit"><span class="tag warn">ไม่มีหน่วย</span></div>
                  </td>
                  <td>
                    <select v-model="r.category" style="width:118px;font-size:12px">
                      <option v-for="c in CATEGORIES" :key="c" :value="c">{{ c }}</option>
                    </select>
                  </td>
                  <td class="mono hint">{{ r.pns.join(' ') }}
                    <span v-if="r.nPn > r.pns.length">… รวม {{ r.nPn }}</span></td>
                </tr>
              </tbody>
            </table>
          </div>

          <div class="row" style="margin-top:12px">
            <button class="btn" @click="regDraft.forEach(r => r.take = true)">เลือกทั้งหมด</button>
            <button class="btn" @click="regDraft.forEach(r => r.take = false)">ไม่เลือกเลย</button>
            <div class="grow"></div>
            <button class="btn primary" @click="applyRegPlan" :disabled="regBusy || !regTake.length">
              {{ regBusy ? 'กำลังเพิ่ม...' : 'เพิ่ม ' + regTake.length + ' รหัสเข้าทะเบียน' }}</button>
          </div>
        </div>
      </div>

      <!-- ════════ ยกเลิกรายการ ════════ -->
      <div class="modal" v-if="voidBox.row" @click.self="voidBox.row=null">
        <div class="modal-box" style="width:min(520px,100%)">
          <h2>ยกเลิกรายการนี้</h2>
          <p class="hint" style="margin:-4px 0 10px">
            รายการจะไม่ถูกลบ แต่จะไม่นับเข้ายอด และยังเห็นได้ในการ์ดว่าใครยกเลิกเพราะอะไร
            — สมุดเขียนเพิ่มได้อย่างเดียว
          </p>
          <table><tbody>
            <tr><td class="hint" style="width:90px">วันที่</td>
                <td class="mono">{{ localDate(voidBox.row.at) }}</td></tr>
            <tr><td class="hint">รายการ</td>
                <td>{{ voidBox.row.kindLabel }} <b class="mono">{{ voidBox.row.qty }}</b>
                    <span class="mono hint">{{ voidBox.row.lot ? '· ล็อต ' + voidBox.row.lot : '' }}</span></td></tr>
            <tr><td class="hint">ผู้บันทึก</td><td>{{ voidBox.row.person }}</td></tr>
          </tbody></table>
          <div class="msg warn" v-if="voidAfterAdjust" style="margin:12px 0 0">
            <b>รายการนี้อยู่ก่อนการปรับยอดวันที่ {{ localDate(voidAfterAdjust.at) }}</b><br>
            <span class="hint">ส่วนต่างของการปรับยอดถูกแช่แข็งไว้ตั้งแต่ตอนบันทึกและจะไม่คำนวณใหม่
              ยกเลิกแล้วยอดคงเหลือจะไม่ตรงกับ {{ voidAfterAdjust.counted_qty }} ที่เคยนับได้อีก
              — ถ้าของจริงยังเท่าเดิม ให้ปรับยอดอีกครั้งหลังยกเลิก</span>
          </div>

          <div class="row" style="margin-top:12px">
            <label class="f grow">ยกเลิกเพราะอะไร
              <input v-model="voidBox.reason" placeholder="เช่น คีย์จำนวนผิด คีย์ซ้ำ"></label>
            <label class="f" style="width:150px">ใครสั่งยกเลิก
              <input v-model="voidBox.by"></label>
          </div>
          <div class="row" style="margin-top:12px">
            <div class="grow"></div>
            <button class="btn" @click="voidBox.row=null">ไม่ยกเลิกแล้ว</button>
            <button class="btn primary" @click="doVoid"
                    :disabled="!voidBox.reason.trim() || !voidBox.by.trim()">ยืนยันยกเลิก</button>
          </div>
        </div>
      </div>

      <!-- ════════ ค้นหารหัส (ใช้ร่วมกันทุกหน้า) ════════ -->
      <div class="modal" v-if="pick" @click.self="pick=null">
        <div class="modal-box">
          <div class="row">
            <input v-model.trim="pickQ" class="grow" placeholder="พิมพ์รหัสหรือชื่อ" ref="pickInput">
            <button class="btn" @click="pick=null">ปิด</button>
          </div>
          <div class="scroll" style="margin-top:10px;max-height:52vh">
            <table>
              <thead><tr><th style="width:120px">รหัส</th><th>ชื่อ</th>
                <th style="width:60px">หน่วย</th><th style="width:110px">หมวด</th></tr></thead>
              <tbody><tr v-for="m in pickResults" :key="m.material_code"
                         style="cursor:pointer" @click="choosePick(m)">
                <td class="mono"><b>{{ m.material_code }}</b></td>
                <td>{{ m.description }}
                  <span v-if="m.dupDesc" class="tag warn">ชื่อซ้ำ — ดูรหัส</span></td>
                <td class="mono">{{ m.unit }}</td>
                <td><span class="tag">{{ m.category }}</span></td>
              </tr></tbody>
            </table>
            <p v-if="!pickResults.length" class="empty">ไม่เจอ — พิมพ์รหัสลงช่องแล้วกด "เพิ่มเลย" ได้</p>
          </div>
        </div>
      </div>
    </main>

    <div class="toast" :class="{bad:toast.bad}" v-if="toast.show">{{ toast.text }}</div>
  </template>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
